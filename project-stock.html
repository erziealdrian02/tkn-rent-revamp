<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Proyek - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-header-title">Stok Proyek</h2>
            <p class="page-header-subtitle">Kebutuhan alat, pengiriman per SJ, sisa kebutuhan dan pemulangan per proyek</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()"><i class="bi bi-download me-1"></i>Export CSV</button>
          </div>
        </div>

        <div class="er-card mb-4"><div class="er-card-body">
          <div class="table-toolbar mb-0"><div class="table-toolbar-left w-100">
            <label class="form-label-er mb-0">Proyek</label>
            <select class="form-select" id="projSelect" style="max-width:560px" onchange="selectProject(this.value)"></select>
            <select class="filter-select" id="projStatus" onchange="renderList()">
              <option value="open">Proyek berjalan</option>
              <option value="">Semua status</option>
            </select>
          </div></div>
        </div></div>

        <div id="projDetail"></div>
      </div>
    </main>
  </div>

  <!-- Edit Requirements Modal -->
  <div class="modal fade" id="reqModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Kebutuhan Alat Proyek</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="fs-13 text-muted">Masukkan qty kebutuhan alat dan harga satuan untuk proyek ini.</p>
        <div class="er-table-wrapper"><table class="er-table">
          <thead><tr><th>Nama Alat</th><th class="num" style="width:110px">Qty</th><th class="num" style="width:180px">Harga Satuan</th><th class="num" style="width:160px">Nilai</th><th style="width:40px"></th></tr></thead>
          <tbody id="reqBody"></tbody>
          <tfoot><tr><td colspan="3">TOTAL NILAI</td><td class="num" id="reqTotal">Rp 0</td><td></td></tr></tfoot>
        </table></div>
        <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="addReqRow()"><i class="bi bi-plus-lg me-1"></i>Tambah Alat</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" onclick="saveRequirements()"><i class="bi bi-check-lg me-1"></i>Simpan Kebutuhan</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('project-stock.html', [{label:'Rekap Stok',href:'#'},{label:'Stok Proyek'}], 'Stok Proyek');

    const L = BizLogic.StockLedger;
    const T = L.TYPES;
    let selectedId = getUrlParam('id');
    if (!selectedId) {
      const first = MockData.projects.find(p => p.status === 'Active') || MockData.projects[0];
      selectedId = first && first.id;
    }

    function totals(summary) {
      return summary.reduce((t, r) => {
        t.required += r.required; t.delivered += r.delivered; t.returned += r.returned; t.lost += r.lost; t.onSite += r.onSite;
        t.remaining += Math.max(r.remaining, 0); t.value += r.required * r.unitPrice;
        return t;
      }, { required: 0, delivered: 0, returned: 0, lost: 0, onSite: 0, remaining: 0, value: 0 });
    }

    function pct(a, b) { return b ? Math.min(100, Math.round(a / b * 100)) : 0; }

    function renderList() {
      const st = document.getElementById('projStatus').value;
      const list = MockData.projects.filter(p => !(st === 'open' && ['Completed', 'Cancelled'].includes(p.status) && p.id !== selectedId));
      document.getElementById('projSelect').innerHTML = list.map(p => {
        const t = totals(L.projectSummary(p.id));
        return `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${p.name} - ${p.customerName} (${t.delivered}/${t.required} terkirim, ${t.onSite} di lokasi)</option>`;
      }).join('');
    }

    function selectProject(id) {
      selectedId = id;
      history.replaceState(null, '', 'project-stock.html?id=' + id);
      renderList();
      renderDetail();
    }

    function num(v, cls) { return `<td class="num ${v === 0 ? 'zero' : ''} ${cls || ''}">${formatNumber(v)}</td>`; }

    function sjCards(docs, emptyText) {
      if (!docs.length) return `<div class="empty-state py-4"><i class="bi bi-inbox"></i><p class="mb-0">${emptyText}</p></div>`;
      return docs.map(d => {
        const loc = d.from.type === 'project' ? d.to : d.from;
        return `<div class="sj-card">
          <div class="sj-card-header">
            <a href="stock-mutations.html?type=${d.type}" class="text-mono fw-600">${d.no}</a>
            <span><i class="bi bi-calendar me-1 text-muted"></i>${formatDate(d.date)}</span>
            <span class="loc-chip"><i class="bi ${L.locIcon(loc)}"></i>${L.locName(loc)}</span>
            ${d.reference ? `<span class="fs-12 text-muted text-mono">${d.reference}</span>` : ''}
            <span class="ms-auto fw-600">${formatNumber(d.items.reduce((s, i) => s + i.qty, 0))} unit</span>
          </div>
          <table class="er-table"><tbody>${d.items.map(i => `<tr>
            <td>${i.equipment}</td>
            <td style="width:120px">${i.condition === 'damaged' ? '<span class="badge-status damaged">Rusak</span>' : ''}</td>
            <td class="num" style="width:100px">${formatNumber(i.qty)}</td>
          </tr>`).join('')}</tbody></table>
        </div>`;
      }).join('');
    }

    function renderDetail() {
      const p = MockData.projects.find(x => x.id === selectedId);
      const el = document.getElementById('projDetail');
      if (!p) { el.innerHTML = '<div class="er-card"><div class="empty-state"><p>Pilih proyek</p></div></div>'; return; }

      const summary = L.projectSummary(p.id).sort((a, b) => (b.required - a.required) || a.equipment.localeCompare(b.equipment));
      const t = totals(summary);
      const deliveries = L.projectDocs(p.id, 'DELIVERY');
      const returns = L.projectDocs(p.id, 'RETURN');
      const losts = L.projectDocs(p.id, 'LOST');
      const closed = ['Completed', 'Cancelled'].includes(p.status);

      el.innerHTML = `
        <div class="er-card mb-4">
          <div class="detail-header">
            <div class="detail-header-left">
              <div class="detail-header-icon"><i class="bi bi-folder-check"></i></div>
              <div class="detail-header-info">
                <h2>${p.name} ${statusBadge(p.status)}</h2>
                <div class="detail-meta">
                  <span class="detail-meta-item"><i class="bi bi-hash"></i><a href="project-detail.html?id=${p.id}">${p.id}</a></span>
                  <span class="detail-meta-item"><i class="bi bi-people"></i>${p.customerName}</span>
                  <span class="detail-meta-item"><i class="bi bi-calendar"></i>${formatDate(p.startDate)} - ${formatDate(p.endDate)}</span>
                </div>
              </div>
            </div>
            <div class="detail-header-actions">
              <button class="btn btn-outline-secondary btn-sm" onclick="openReq()"><i class="bi bi-pencil me-1"></i>Ubah Kebutuhan</button>
              ${closed ? '' : `<a class="btn btn-primary btn-sm" href="stock-mutations.html?new=DELIVERY&project=${p.id}"><i class="bi bi-truck me-1"></i>Kirim Alat (SJ)</a>`}
              ${t.onSite > 0 ? `<a class="btn btn-success btn-sm" href="stock-mutations.html?new=RETURN&project=${p.id}"><i class="bi bi-box-arrow-in-left me-1"></i>Pulangkan Alat (SJ)</a>` : ''}
            </div>
          </div>
          <div class="er-card-body">
            <div class="row g-3 mb-4">
              <div class="col-6 col-md"><div class="kpi-card"><div class="kpi-icon blue"><span class="fw-600">A</span></div><div class="kpi-content"><div class="kpi-value">${formatNumber(t.required)}</div><div class="kpi-label">Kebutuhan Alat</div><div class="fs-11 text-muted mt-1">${formatRupiah(t.value)}</div></div></div></div>
              <div class="col-6 col-md"><div class="kpi-card"><div class="kpi-icon purple"><span class="fw-600">B</span></div><div class="kpi-content"><div class="kpi-value">${formatNumber(t.delivered)}</div><div class="kpi-label">Terkirim (${deliveries.length} SJ)</div></div></div></div>
              <div class="col-6 col-md"><div class="kpi-card"><div class="kpi-icon orange"><span class="fw-600">C</span></div><div class="kpi-content"><div class="kpi-value">${formatNumber(t.remaining)}</div><div class="kpi-label">Sisa Kebutuhan</div></div></div></div>
              <div class="col-6 col-md"><div class="kpi-card"><div class="kpi-icon info"><span class="fw-600">D</span></div><div class="kpi-content"><div class="kpi-value">${formatNumber(t.returned)}</div><div class="kpi-label">Dipulangkan (${returns.length} SJ)</div></div></div></div>
              <div class="col-12 col-md"><div class="kpi-card"><div class="kpi-icon green"><i class="bi bi-geo-alt"></i></div><div class="kpi-content"><div class="kpi-value">${formatNumber(t.onSite)}</div><div class="kpi-label">Stok di Lokasi Proyek</div></div></div></div>
            </div>

            <div class="er-table-wrapper"><table class="er-table">
              <thead><tr>
                <th>No</th><th>Nama Alat</th><th class="num">Harga Satuan</th>
                <th class="num">A. Kebutuhan</th><th class="num">B. Terkirim</th><th class="num">C. Sisa (A−B)</th>
                <th class="num">D. Dipulangkan</th><th class="num">Hilang</th><th class="num">Di Lokasi</th><th>Progress Kirim</th>
              </tr></thead>
              <tbody>${summary.map((r, i) => {
                const prog = pct(r.delivered, r.required);
                const remainCls = r.remaining > 0 ? 'qty-warn' : r.remaining < 0 ? 'qty-minus' : 'zero';
                const remainText = r.remaining < 0 ? `lebih ${formatNumber(-r.remaining)}` : formatNumber(r.remaining);
                return `<tr>
                  <td class="text-muted">${i + 1}</td>
                  <td class="fw-600 text-nowrap">${r.equipment}${!r.required ? ' <span class="badge-status draft">di luar kebutuhan</span>' : ''}</td>
                  <td class="num">${r.unitPrice ? formatRupiah(r.unitPrice) : '-'}</td>
                  ${num(r.required, 'fw-600')}${num(r.delivered)}
                  <td class="num ${remainCls}">${remainText}</td>
                  ${num(r.returned)}${num(r.lost, r.lost ? 'qty-minus' : '')}${num(r.onSite, 'col-strong')}
                  <td><div class="d-flex align-items-center gap-2"><div class="progress-thin flex-grow-1"><span class="${prog >= 100 ? 'done' : ''}" style="width:${prog}%"></span></div><span class="fs-11 text-muted">${prog}%</span></div></td>
                </tr>`;
              }).join('') || '<tr><td colspan="10" class="text-center text-muted py-4">Belum ada kebutuhan alat. Klik <strong>Ubah Kebutuhan</strong> untuk mengisi.</td></tr>'}</tbody>
              <tfoot><tr><td></td><td>TOTAL</td><td class="num">${formatRupiah(t.value)}</td>
                <td class="num">${formatNumber(t.required)}</td><td class="num">${formatNumber(t.delivered)}</td><td class="num">${formatNumber(t.remaining)}</td>
                <td class="num">${formatNumber(t.returned)}</td><td class="num">${formatNumber(t.lost)}</td><td class="num">${formatNumber(t.onSite)}</td><td></td></tr></tfoot>
            </table></div>
            <p class="fs-12 text-muted mt-2 mb-0"><i class="bi bi-info-circle me-1"></i>Di Lokasi = Terkirim − Dipulangkan − Hilang. Harga satuan × kebutuhan = nilai kebutuhan proyek.</p>
          </div>
        </div>

        <div class="er-card">
          <div class="er-tabs">
            <button class="er-tab active" data-tab="sjk" onclick="switchTab('sjk')">B. Pengiriman per SJ<span class="er-tab-count">${deliveries.length}</span></button>
            <button class="er-tab" data-tab="sjr" onclick="switchTab('sjr')">D. Pemulangan per SJ<span class="er-tab-count">${returns.length}</span></button>
            ${losts.length ? `<button class="er-tab" data-tab="lost" onclick="switchTab('lost')">Hilang<span class="er-tab-count">${losts.length}</span></button>` : ''}
          </div>
          <div class="er-tab-content active" id="tab-sjk"><div class="er-card-body">${sjCards(deliveries, 'Belum ada pengiriman ke proyek ini')}</div></div>
          <div class="er-tab-content" id="tab-sjr"><div class="er-card-body">${sjCards(returns, 'Belum ada pemulangan dari proyek ini')}</div></div>
          ${losts.length ? `<div class="er-tab-content" id="tab-lost"><div class="er-card-body">${sjCards(losts, '')}</div></div>` : ''}
        </div>`;
    }

    // ---------- Kebutuhan alat ----------
    function reqRowHtml(r) {
      r = r || { equipment: '', qty: 1, unitPrice: 0 };
      const opts = '<option value="">Pilih alat...</option>' + L.equipmentNames().map(n => `<option ${n === r.equipment ? 'selected' : ''}>${n.replace(/"/g, '&quot;')}</option>`).join('');
      return `<tr>
        <td><select class="form-select form-select-sm rq-eq" onchange="onReqEq(this)">${opts}</select></td>
        <td><input type="number" class="form-control form-control-sm text-end rq-qty" min="1" value="${r.qty}" oninput="calcReq()"></td>
        <td><input type="number" class="form-control form-control-sm text-end rq-price" min="0" value="${r.unitPrice}" oninput="calcReq()"></td>
        <td class="num rq-sub">-</td>
        <td><button type="button" class="btn-action text-danger" onclick="this.closest('tr').remove(); calcReq();"><i class="bi bi-x-lg"></i></button></td>
      </tr>`;
    }
    function addReqRow(r) { document.getElementById('reqBody').insertAdjacentHTML('beforeend', reqRowHtml(r)); calcReq(); }
    function onReqEq(sel) {
      const price = sel.closest('tr').querySelector('.rq-price');
      if (!Number(price.value)) price.value = L.defaultRate(sel.value);
      calcReq();
    }
    function calcReq() {
      let total = 0;
      document.querySelectorAll('#reqBody tr').forEach(tr => {
        const sub = (Number(tr.querySelector('.rq-qty').value) || 0) * (Number(tr.querySelector('.rq-price').value) || 0);
        tr.querySelector('.rq-sub').textContent = formatRupiah(sub);
        total += sub;
      });
      document.getElementById('reqTotal').textContent = formatRupiah(total);
    }
    function openReq() {
      const p = MockData.projects.find(x => x.id === selectedId);
      document.getElementById('reqBody').innerHTML = '';
      (p.requirements && p.requirements.length ? p.requirements : [null]).forEach(addReqRow);
      bootstrap.Modal.getOrCreateInstance(document.getElementById('reqModal')).show();
    }
    function saveRequirements() {
      const rows = [...document.querySelectorAll('#reqBody tr')].map(tr => ({
        equipment: tr.querySelector('.rq-eq').value,
        qty: Number(tr.querySelector('.rq-qty').value) || 0,
        unitPrice: Number(tr.querySelector('.rq-price').value) || 0
      })).filter(r => r.equipment && r.qty > 0);
      const names = rows.map(r => r.equipment);
      if (new Set(names).size !== names.length) { showToast('Ada alat yang diinput lebih dari sekali', 'warning'); return; }
      const p = MockData.projects.find(x => x.id === selectedId);
      p.requirements = rows;
      MockData.save('projects');
      BizLogic.Activity.log('Kebutuhan alat proyek ' + p.id + ' diperbarui (' + rows.length + ' jenis alat)', 'info');
      bootstrap.Modal.getInstance(document.getElementById('reqModal')).hide();
      showToast('Kebutuhan alat disimpan', 'success');
      renderList();
      renderDetail();
    }

    function exportCSV() {
      const rows = [['Proyek', 'Customer', 'Nama Alat', 'Harga Satuan', 'A. Kebutuhan', 'B. Terkirim', 'C. Sisa (A-B)', 'D. Dipulangkan', 'Hilang', 'Di Lokasi']];
      MockData.projects.forEach(p => L.projectSummary(p.id).forEach(r => rows.push([
        p.name, p.customerName, r.equipment, r.unitPrice, r.required, r.delivered, r.remaining, r.returned, r.lost, r.onSite
      ])));
      downloadCSV('stok-proyek-' + new Date().toISOString().split('T')[0] + '.csv', rows);
    }

    renderList();
    renderDetail();
  </script>
</body>
</html>
