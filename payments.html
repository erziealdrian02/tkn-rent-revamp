<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Tagihan - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Pembayaran Tagihan</h2><p class="page-header-subtitle">Pembayaran dari invoice, baik cicilan maupun lunas</p></div>
          <div class="page-header-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()"><i class="bi bi-download me-1"></i>Export CSV</button>
            <button class="btn btn-primary btn-sm" onclick="openPay()"><i class="bi bi-plus-lg me-1"></i>Catat Pembayaran</button>
          </div>
        </div>

        <div class="row g-3 mb-4" id="kpis"></div>

        <div class="er-card"><div class="er-card-body">
          <div class="table-toolbar"><div class="table-toolbar-left">
            <div class="table-search"><i class="bi bi-search"></i><input type="text" placeholder="Cari no. bayar, invoice, customer..." id="searchInput" oninput="render()"></div>
            <select class="filter-select" id="kindFilter" onchange="render()"><option value="">Cicilan &amp; Lunas</option><option>Cicilan</option><option>Lunas</option></select>
            <select class="filter-select" id="accFilter" onchange="render()"><option value="">Semua Rekening</option></select>
            <input type="month" class="filter-select" id="monthFilter" onchange="render()">
          </div></div>
          <div class="er-table-wrapper"><table class="er-table">
            <thead><tr><th>No. Bayar</th><th>Tanggal</th><th>Invoice</th><th>Customer</th><th>Jenis</th><th>Rekening</th><th>Metode / Ref</th><th class="num">Jumlah</th></tr></thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
          </table></div>
        </div></div>
      </div>
    </main>
  </div>

  <!-- Payment Modal -->
  <div class="modal fade" id="payModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Catat Pembayaran</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label form-label-er">Invoice <span class="text-danger">*</span></label>
          <select class="form-select" id="payInvoice" onchange="onInvoice()"></select>
          <div class="fs-12 text-muted mt-1" id="payInfo"></div>
        </div>
        <div class="mb-3">
          <label class="form-label form-label-er">Jenis Pembayaran</label>
          <div class="d-flex gap-3">
            <label class="d-flex align-items-center gap-2"><input type="radio" class="form-check-input m-0" name="payKind" value="full" checked onchange="onKind()"> Lunas</label>
            <label class="d-flex align-items-center gap-2"><input type="radio" class="form-check-input m-0" name="payKind" value="partial" onchange="onKind()"> Cicilan</label>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-6"><label class="form-label form-label-er">Tanggal Bayar</label><input type="date" id="payDate" class="form-control"></div>
          <div class="col-6"><label class="form-label form-label-er">Jumlah</label><div class="input-group"><span class="input-group-text">Rp</span><input type="number" id="payAmount" class="form-control text-end"></div></div>
          <div class="col-6"><label class="form-label form-label-er">Masuk ke Rekening</label><select class="form-select" id="payAccount"></select></div>
          <div class="col-6"><label class="form-label form-label-er">Metode</label><select class="form-select" id="payMethod" onchange="onMethodChange()"><option>Transfer</option><option>Giro</option><option>Tunai</option></select></div>
          <div class="col-12"><label class="form-label form-label-er">No. Referensi / Bukti</label><input type="text" id="payRef" class="form-control"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-success" onclick="submitPayment()"><i class="bi bi-check-lg me-1"></i>Simpan Pembayaran</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('payments.html', [{label:'Piutang',href:'#'},{label:'Pembayaran Tagihan'}], 'Pembayaran Tagihan');
    const Inv = BizLogic.Invoice;
    const invById = id => MockData.invoices.find(i => i.id === id);
    const accName = id => (MockData.accounts.find(a => a.id === id) || {}).name || id;
    document.getElementById('accFilter').innerHTML += MockData.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    document.getElementById('payAccount').innerHTML = MockData.accounts.map(a => `<option value="${a.id}">${a.kind === 'Kas' ? 'Kas - ' + a.name : a.name + ' - ' + a.accountNumber}</option>`).join('');
    // Tunai masuk ke akun Kas, Transfer/Giro ke rekening bank invoice
    function onMethodChange() {
      const tunai = document.getElementById('payMethod').value === 'Tunai';
      const sel = document.getElementById('payAccount');
      const kas = MockData.accounts.find(a => a.kind === 'Kas' && a.status !== 'Inactive');
      const isKas = (MockData.accounts.find(a => a.id === sel.value) || {}).kind === 'Kas';
      if (tunai && kas && !isKas) sel.value = kas.id;
      if (!tunai && isKas && current) sel.value = current.accountId;
    }

    function rows() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const k = document.getElementById('kindFilter').value;
      const a = document.getElementById('accFilter').value;
      const m = document.getElementById('monthFilter').value;
      return MockData.payments.filter(p => {
        const inv = invById(p.invoiceId) || {};
        if (q && !(p.id + ' ' + p.invoiceId + ' ' + (inv.customerName || '') + ' ' + p.reference).toLowerCase().includes(q)) return false;
        if (k && p.kind !== k) return false;
        if (a && p.accountId !== a) return false;
        if (m && !p.date.startsWith(m)) return false;
        return true;
      }).sort((x, y) => y.date.localeCompare(x.date) || y.id.localeCompare(x.id));
    }

    function render() {
      const data = rows();
      const total = data.reduce((s, p) => s + p.amount, 0);
      const thisMonth = new Date().toISOString().slice(0, 7);
      const monthTotal = MockData.payments.filter(p => p.date.startsWith(thisMonth)).reduce((s, p) => s + p.amount, 0);
      const outstanding = MockData.invoices.reduce((s, i) => s + Inv.outstanding(i), 0);
      document.getElementById('kpis').innerHTML = `
        <div class="col-md-4"><div class="kpi-card"><div class="kpi-icon green"><i class="bi bi-cash-coin"></i></div><div class="kpi-content"><div class="kpi-value fs-5">${formatRupiah(monthTotal)}</div><div class="kpi-label">Diterima bulan ini</div></div></div></div>
        <div class="col-md-4"><div class="kpi-card"><div class="kpi-icon blue"><i class="bi bi-list-check"></i></div><div class="kpi-content"><div class="kpi-value fs-5">${formatRupiah(total)}</div><div class="kpi-label">Total sesuai filter (${data.length} transaksi)</div></div></div></div>
        <div class="col-md-4"><div class="kpi-card"><div class="kpi-icon orange"><i class="bi bi-hourglass-split"></i></div><div class="kpi-content"><div class="kpi-value fs-5">${formatRupiah(outstanding)}</div><div class="kpi-label"><a href="receivables.html">Sisa piutang keseluruhan</a></div></div></div></div>`;

      document.getElementById('tableBody').innerHTML = data.map(p => {
        const inv = invById(p.invoiceId) || {};
        return `<tr>
          <td class="text-mono">${p.id}</td><td class="text-nowrap">${formatDate(p.date)}</td>
          <td><a href="invoice-detail.html?id=${p.invoiceId}" class="cell-link text-mono">${p.invoiceId}</a><div class="fs-11 text-muted">${inv.projectName || ''}</div></td>
          <td>${inv.customerName || '-'}</td>
          <td><span class="badge-status ${p.kind === 'Lunas' ? 'paid' : 'partial'}">${p.kind}</span></td>
          <td>${accName(p.accountId)}</td>
          <td class="fs-12">${p.method}${p.reference ? ' · <span class="text-mono">' + p.reference + '</span>' : ''}</td>
          <td class="num fw-600">${formatRupiah(p.amount)}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">Belum ada pembayaran</td></tr>';
      document.getElementById('tableFoot').innerHTML = data.length ? `<tr><td colspan="7">TOTAL</td><td class="num">${formatRupiah(total)}</td></tr>` : '';
    }

    // ---------- Form ----------
    let current = null;
    function openPay(invoiceId) {
      const open = MockData.invoices.filter(i => Inv.outstanding(i) > 0).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      if (!open.length) { showToast('Tidak ada invoice yang belum lunas', 'info'); return; }
      document.getElementById('payInvoice').innerHTML = open.map(i =>
        `<option value="${i.id}" ${i.id === invoiceId ? 'selected' : ''}>${i.id} - ${i.customerName} - sisa ${formatRupiah(Inv.outstanding(i))}${Inv.statusOf(i) === 'Overdue' ? ' (jatuh tempo)' : ''}</option>`).join('');
      document.getElementById('payDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('payRef').value = '';
      onInvoice();
      bootstrap.Modal.getOrCreateInstance(document.getElementById('payModal')).show();
    }
    function onInvoice() {
      current = invById(document.getElementById('payInvoice').value);
      document.getElementById('payAccount').value = current.accountId;
      onMethodChange();
      document.getElementById('payInfo').innerHTML = `Total ${formatRupiah(current.amount)} · dibayar ${formatRupiah(Inv.paidAmount(current))} · jatuh tempo ${formatDate(current.dueDate)}`;
      onKind();
    }
    function onKind() {
      const full = document.querySelector('input[name="payKind"]:checked').value === 'full';
      const amt = document.getElementById('payAmount');
      amt.value = full ? Inv.outstanding(current) : '';
      amt.readOnly = full;
    }
    function submitPayment() {
      const res = BizLogic.Payment.record(current.id, {
        date: document.getElementById('payDate').value,
        amount: document.getElementById('payAmount').value,
        accountId: document.getElementById('payAccount').value,
        method: document.getElementById('payMethod').value,
        reference: document.getElementById('payRef').value
      });
      if (!res.success) { showToast(res.error, 'error'); return; }
      bootstrap.Modal.getInstance(document.getElementById('payModal')).hide();
      showToast(`Pembayaran ${res.payment.kind.toLowerCase()} ${res.payment.id} tercatat`, 'success');
      render();
    }

    function exportCSV() {
      const out = [['No. Bayar', 'Tanggal', 'Invoice', 'Customer', 'Jenis', 'Rekening', 'Metode', 'Referensi', 'Jumlah']];
      rows().forEach(p => { const inv = invById(p.invoiceId) || {}; out.push([p.id, p.date, p.invoiceId, inv.customerName, p.kind, accName(p.accountId), p.method, p.reference, p.amount]); });
      downloadCSV('pembayaran-' + new Date().toISOString().split('T')[0] + '.csv', out);
    }

    render();
    if (getUrlParam('invoice')) openPay(getUrlParam('invoice'));
  </script>
</body>
</html>
