<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penyewaan - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-header-title">Penyewaan</h2>
            <p class="page-header-subtitle">Kelola transaksi penyewaan alat</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>Ekspor</button>
            <a href="rental-create.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Penyewaan Baru</a>
          </div>
        </div>

        <div class="er-card">
          <div class="er-card-body">
            <div class="table-toolbar">
              <div class="table-toolbar-left">
                <div class="table-search">
                  <i class="bi bi-search"></i>
                  <input type="text" placeholder="Cari penyewaan..." id="searchInput" oninput="filterRentals()">
                </div>
                <select class="filter-select" id="statusFilter" onchange="filterRentals()">
                  <option value="">Semua Status</option>
                  <option value="Draft">Draft</option><option value="Pending Approval">Menunggu Persetujuan</option><option value="Approved">Disetujui</option><option value="Rejected">Ditolak</option>
                  <option value="Preparing">Mempersiapkan</option><option value="Partially Delivered">Sebagian Dikirim</option><option value="On Rental">Di Sewa</option>
                  <option value="Partially Returned">Sebagian Kembali</option><option value="Overdue">Terlambat</option><option value="Completed">Selesai</option><option value="Cancelled">Dibatalkan</option>
                </select>
                <select class="filter-select" id="customerFilter" onchange="filterRentals()">
                  <option value="">Semua Pelanggan</option>
                </select>
              </div>
            </div>

            <div class="er-table-wrapper">
              <table class="er-table">
                <thead>
                  <tr>
                    <th>No. Penyewaan</th><th>Pelanggan</th><th>Proyek</th><th>Tgl. Sewa</th>
                    <th>Tgl. Kembali</th><th>Item</th><th>Pengiriman</th><th>Status</th>
                    <th>Faktur</th><th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="rentalTableBody"></tbody>
              </table>
            </div>
            <div class="er-card-footer" id="rentalPagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script>
    const user = initApp('rentals.html', [{label:'Penyewaan',href:'#'},{label:'Penyewaan'}], 'Penyewaan');

    // Populate customer filter
    const custFilter = document.getElementById('customerFilter');
    const uniqueCustomers = [...new Set(MockData.rentals.map(r => r.customerName))];
    uniqueCustomers.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; custFilter.appendChild(o); });

    let currentPage = 1;
    const pageSize = 10;

    function filterRentals() { currentPage = 1; renderRentals(); }

    function changePage(p) { currentPage = p; renderRentals(); }

    function renderRentals() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const customer = document.getElementById('customerFilter').value;

      let data = MockData.rentals.filter(r => {
        if (search && !r.id.toLowerCase().includes(search) && !r.customerName.toLowerCase().includes(search) && !r.projectName.toLowerCase().includes(search)) return false;
        if (status) {
          if (status === 'Overdue') {
            if (!BizLogic.Rental.isOverdue(r)) return false;
          } else if (status === 'Pending Approval' && r.status === 'Waiting Approval') {
            // legacy compat
          } else if (r.status !== status) return false;
        }
        if (customer && r.customerName !== customer) return false;
        return true;
      });

      const total = data.length;
      const paged = data.slice((currentPage-1)*pageSize, currentPage*pageSize);

      document.getElementById('rentalTableBody').innerHTML = paged.length ? paged.map(r => {
        const isOverdue = BizLogic.Rental.isOverdue(r);
        const overdueDays = BizLogic.Rental.getOverdueDays(r);
        const displayStatus = isOverdue ? 'Overdue' : r.status;
        return `<tr${isOverdue ? ' class="table-danger"' : ''}>
          <td><a href="rental-detail.html?id=${r.id}" class="cell-link text-mono">${r.id}</a></td>
          <td>${r.customerName}</td>
          <td><a href="project-detail.html?id=${r.projectId}" class="cell-link">${r.projectName}</a></td>
          <td>${formatDate(r.rentalDate)}</td>
          <td>${formatDate(r.returnDate)}${isOverdue ? ' <span class="badge bg-danger ms-1">' + overdueDays + 'd</span>' : ''}</td>
          <td><span class="badge bg-light text-dark border">${r.items ? r.items.length : r.totalItems}</span></td>
          <td>${statusBadge(r.deliveryStatus)}</td>
          <td>${statusBadge(displayStatus)}</td>
          <td>${statusBadge(r.invoiceStatus)}</td>
          <td>
            <a href="rental-detail.html?id=${r.id}" class="btn-action" title="View"><i class="bi bi-eye"></i></a>
          </td>
        </tr>`;
      }).join('') : '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada penyewaan ditemukan</td></tr>';

      document.getElementById('rentalPagination').innerHTML = renderPagination(total, currentPage, pageSize, 'changePage');
    }

    renderRentals();
  </script>
</body>
</html>
