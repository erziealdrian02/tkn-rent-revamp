<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pembelian - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="er-card mb-4">
          <div class="detail-header" id="detailHeader"></div>
          <div class="er-card-body" id="detailBody"></div>
        </div>
      </div>
    </main>
  </div>
  <!-- Receive Modal -->
  <div class="modal fade" id="receiveModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Receive Items</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label form-label-er">Receipt Date</label><input type="date" class="form-control" id="recvDate"></div>
          <div class="mb-3"><label class="form-label form-label-er">Target Branch</label>
            <select class="form-select" id="recvBranch"></select>
          </div>
          <div id="recvItems"></div>
          <div class="mb-3"><label class="form-label form-label-er">Notes</label><textarea class="form-control" rows="2" id="recvNotes"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success" onclick="receiveItems()"><i class="bi bi-check-lg me-1"></i>Confirm Receipt</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const pid = getUrlParam('id') || 'PO-001';
    const po = MockData.purchases.find(p => p.id === pid) || MockData.purchases[0];
    initApp('purchases.html',[{label:'Inventaris',href:'#'},{label:'Pembelian',href:'purchases.html'},{label:po.id}],po.id);
    const vendor = po.vendor || po.supplier || '-';
    const poDate = po.poDate || po.purchaseDate;

    // Pembayaran ke supplier = Bon Merah kategori pembayaran supplier dengan referensi no. PO
    const CB = BizLogic.CashBank;
    const poRe = new RegExp('\\b' + po.id + '\\b');
    const supplierPays = CB.entries().filter(e => e.type === 'OUT' && /_supplier$/.test(CB.categoryOf(e)) && poRe.test(e.reference || ''));
    const paidSupplier = supplierPays.reduce((t, e) => t + e.amount, 0);
    const debt = Math.max(0, po.totalAmount - paidSupplier);
    const payAcc = CB.account(po.accountId) || MockData.accounts.find(a => CB.kindOf(a) === 'Bank');
    const payUrl = 'finance-ledger.html?' + new URLSearchParams({ new: 'out', acc: payAcc.id, cat: CB.kindOf(payAcc) === 'Kas' ? 'kas_out_supplier' : 'bank_out_supplier', amount: debt, ref: po.id, party: vendor, desc: 'Pembayaran ' + po.id });
    const receipts = (MockData.goodsReceipts || []).filter(g => g.purchaseId === po.id);

    document.getElementById('detailHeader').innerHTML = `
      <div class="detail-header-left">
        <div class="detail-header-icon"><i class="bi bi-cart"></i></div>
        <div class="detail-header-info">
          <h2>${po.id} ${statusBadge(po.status)}</h2>
          <div class="detail-meta">
            <span class="detail-meta-item"><i class="bi bi-shop"></i>${vendor}</span>
            <span class="detail-meta-item"><i class="bi bi-calendar"></i>${formatDate(poDate)}</span>
          </div>
        </div>
      </div>
      <div class="detail-header-actions">
        ${['Draft', 'Requested'].includes(po.status) && canDo('Purchases', 'Approve') ? `<button class="btn btn-success btn-sm" onclick="setStatus('Approved')"><i class="bi bi-check-lg me-1"></i>Setujui PO</button>` : ''}
        ${['Draft', 'Requested'].includes(po.status) && !canDo('Purchases', 'Approve') ? `<span class="badge bg-warning-subtle text-warning align-self-center">Menunggu persetujuan Manager</span>` : ''}
        ${po.status === 'Approved' ? `<button class="btn btn-primary btn-sm" onclick="setStatus('Ordered')"><i class="bi bi-send me-1"></i>Pesan ke Supplier</button>` : ''}
        ${po.status === 'Ordered' ? `<button class="btn btn-outline-primary btn-sm" onclick="setStatus('In Transit')"><i class="bi bi-truck me-1"></i>Dalam Pengiriman</button>` : ''}
        ${['Ordered', 'In Transit'].includes(po.status) ? `<button class="btn btn-outline-primary btn-sm" onclick="setStatus('Arrived')"><i class="bi bi-geo-alt me-1"></i>Barang Tiba</button>` : ''}
        ${BizLogic.Purchase.RECEIVABLE.includes(po.status) ? '<button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#receiveModal"><i class="bi bi-box-seam me-1"></i>Receive Items</button>' : ''}
        ${po.status === 'Received' ? `<button class="btn btn-outline-success btn-sm" onclick="setStatus('Completed')"><i class="bi bi-check2-all me-1"></i>Selesaikan PO</button>` : ''}
        ${['Draft', 'Requested', 'Approved', 'Ordered'].includes(po.status) ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelPO()"><i class="bi bi-x-circle me-1"></i>Batalkan</button>` : ''}
        ${debt > 0 ? `<a href="${payUrl}" class="btn btn-danger btn-sm"><i class="bi bi-cash me-1"></i>Bayar Supplier</a>` : ''}
        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-printer me-1"></i>Print PO</button>
      </div>`;

    document.getElementById('detailBody').innerHTML = `
      <div class="row g-4 mb-4">
        <div class="col-md-6">
          <h6 class="fw-600 mb-3">Purchase Order Details</h6>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">PO Number</span><span class="info-value text-mono">${po.id}</span></div>
            <div class="info-item"><span class="info-label">Vendor</span><span class="info-value">${vendor}</span></div>
            <div class="info-item"><span class="info-label">PO Date</span><span class="info-value">${formatDate(poDate)}</span></div>
            <div class="info-item"><span class="info-label">Expected Date</span><span class="info-value">${formatDate(po.expectedDate)}</span></div>
            <div class="info-item"><span class="info-label">Status</span><span class="info-value">${statusBadge(po.status)}</span></div>
            <div class="info-item"><span class="info-label">Created By</span><span class="info-value">${po.createdBy || '-'}</span></div>
            <div class="info-item"><span class="info-label">Total Amount</span><span class="info-value fw-600">${formatRupiah(po.totalAmount)}</span></div>
            <div class="info-item"><span class="info-label">Sudah Dibayar</span><span class="info-value qty-plus">${formatRupiah(paidSupplier)}</span></div>
            <div class="info-item"><span class="info-label">Sisa Hutang Supplier</span><span class="info-value fw-600 ${debt ? 'qty-minus' : ''}">${formatRupiah(debt)}</span></div>
          </div>
        </div>
      </div>
      <h6 class="fw-600 mb-3">Order Items</h6>
      <div class="er-table-wrapper mb-4"><table class="er-table"><thead><tr><th>Equipment</th><th>Qty Ordered</th><th>Qty Received</th><th>Unit Price</th><th>Subtotal</th></tr></thead><tbody>
      ${po.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.received || 0}</td><td>${formatRupiah(i.price)}</td><td class="fw-600">${formatRupiah(i.qty*i.price)}</td></tr>`).join('')}
      </tbody></table></div>
      <h6 class="fw-600 mb-3"><i class="bi bi-cash me-2"></i>Pembayaran ke Supplier</h6>
      <div class="er-table-wrapper mb-4"><table class="er-table"><thead><tr><th>Tanggal</th><th>No. Bon</th><th>Dari Akun</th><th>Keterangan</th><th class="num">Jumlah</th></tr></thead><tbody>
      ${supplierPays.map(e=>`<tr><td>${formatDate(e.date)}</td><td class="text-mono"><a href="finance-ledger.html?account=${e.bankAccountId}">${e.voucherNo}</a></td><td>${(CB.account(e.bankAccountId)||{}).name||e.bankAccountId}</td><td>${e.description}</td><td class="num fw-600">${formatRupiah(e.amount)}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-3">Belum ada pembayaran — klik <strong>Bayar Supplier</strong></td></tr>'}
      </tbody></table></div>
      <h6 class="fw-600 mb-3"><i class="bi bi-clock-history me-2"></i>Activity Timeline</h6>
      ${receipts.length ? `<h6 class="fw-600 mb-3"><i class="bi bi-box-seam me-2"></i>Penerimaan Barang</h6>
      <div class="er-table-wrapper mb-4"><table class="er-table"><thead><tr><th>No. GR</th><th>Tanggal</th><th>Gudang</th><th>Barang</th><th>Diterima Oleh</th></tr></thead><tbody>
      ${receipts.map(g => `<tr><td><a href="goods-receipt-detail.html?id=${g.id}" class="cell-link text-mono">${g.id}</a></td><td>${formatDate(g.receiptDate)}</td><td>${g.branch}</td><td class="fs-12">${g.items.map(i => i.name + ' ×' + i.qty).join(', ')}</td><td>${g.receivedBy}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
      <h6 class="fw-600 mb-3"><i class="bi bi-clock-history me-2"></i>Activity Timeline</h6>
      ${renderActivityTimeline([
        {time:'09:00', date:poDate, action:`Purchase Order ${po.id} dibuat`, user:po.createdBy || '-', type:'info'},
        ...(po.history || []).map(h => ({ time: (h.date.split(' ')[1] || '10:00'), date: h.date.split(' ')[0], action: 'Status → ' + h.status + (h.notes ? ' (' + h.notes + ')' : ''), user: h.user, type: h.status === 'Cancelled' ? 'danger' : 'success' })),
        ...(!po.history ? receipts.map(g => ({ time: '10:00', date: g.receiptDate, action: 'Barang diterima ' + g.id, user: g.receivedBy, type: 'success' })) : [])
      ])}`;

    // Form terima barang: default gudang tujuan PO, qty = sisa pesanan
    document.getElementById('recvDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('recvBranch').innerHTML = MockData.branches.map(b => `<option ${b.id === po.branchId ? 'selected' : ''}>${b.name}</option>`).join('');
    document.getElementById('recvItems').innerHTML = `<table class="table table-sm fs-13"><thead><tr><th>Item</th><th>Dipesan</th><th>Sudah Diterima</th><th>Terima Sekarang</th></tr></thead><tbody>
      ${po.items.map(i => { const rest = i.qty - (i.received || 0); return `<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.received || 0}</td><td><input type="number" class="form-control form-control-sm" value="${rest}" min="0" max="${rest}" ${rest ? '' : 'disabled'}></td></tr>`; }).join('')}
      </tbody></table>`;

    function setStatus(status) {
      const res = BizLogic.Purchase.updateStatus(po.id, status);
      if (!res.success) { showToast(res.error, 'error'); return; }
      showToast('Status PO: ' + status, 'success');
      setTimeout(() => location.reload(), 600);
    }

    function cancelPO() {
      BizLogic.showConfirmModal('Batalkan PO', 'Batalkan <strong>' + po.id + '</strong>?', '<i class="bi bi-x-circle me-1"></i>Batalkan PO', 'btn-danger',
        function(f) {
          const res = BizLogic.Purchase.updateStatus(po.id, 'Cancelled', { notes: f.reason });
          if (!res.success) { showToast(res.error, 'error'); return; }
          showToast('PO dibatalkan', 'warning');
          setTimeout(() => location.reload(), 600);
        },
        [{ id: 'reason', label: 'Alasan', type: 'textarea', required: true }]);
    }

    function receiveItems() {
      const branchName = document.getElementById('recvBranch').value;
      const inputs = document.querySelectorAll('#recvItems input[type="number"]');
      const receivedItems = [];
      
      po.items.forEach((item, index) => {
        const recvQty = Number(inputs[index].value) || 0;
        if(recvQty > 0) {
          receivedItems.push({
            name: item.name,
            qty: recvQty
          });
        }
      });
      
      if(receivedItems.length === 0) {
        showToast('Please enter quantity to receive', 'danger');
        return;
      }
      
      const res = BizLogic.Purchase.createGoodsReceipt(po.id, receivedItems, {
        branch: branchName,
        receiptDate: document.getElementById('recvDate').value,
        notes: document.getElementById('recvNotes').value.trim()
      });
      
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('receiveModal')).hide();
        showToast('Goods Receipt created successfully', 'success');
        setTimeout(() => window.location.href = 'goods-receipt-detail.html?id=' + res.goodsReceipt.id, 800);
      } else {
        showToast(res.error, 'danger');
      }
    }
  </script>
</body>
</html>
