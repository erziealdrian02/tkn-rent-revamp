<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pengembalian - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="er-card mb-4">
          <div class="detail-header" id="detailHeader"></div>
          <div class="er-card-body" id="detailBody"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const rid = getUrlParam('id') || 'RET-003';
    const ret = MockData.returns.find(r => r.id === rid) || MockData.returns[2];
    initApp('returns.html', [{ label: 'Rekap Stok', href: '#' }, { label: 'Pengembalian', href: 'returns.html' }, { label: ret.id }], ret.id);

    const hasMissing = ret.items.some(i => i.damaged > 0 || i.lost > 0);
    const relatedClaims = MockData.claims.filter(c => c.returnId === ret.id);

    document.getElementById('detailHeader').innerHTML = `
      <div class="detail-header-left">
        <div class="detail-header-icon" style="background:var(--warning-bg);color:var(--warning)"><i class="bi bi-box-arrow-in-left"></i></div>
        <div class="detail-header-info">
          <h2>${ret.id} ${statusBadge(ret.status)}</h2>
          <div class="detail-meta">
            ${ret.rentalId ? `<span class="detail-meta-item"><i class="bi bi-file-earmark-text"></i><a href="rental-detail.html?id=${ret.rentalId}">${BizLogic.Rental.title(ret.rentalId)}</a></span>` : ''}
            ${ret.forSaleId ? `<span class="detail-meta-item"><i class="bi bi-bag-check"></i>Dipulangkan untuk dijual: <a href="sale-detail.html?id=${ret.forSaleId}">${ret.forSaleId}</a></span>` : ''}
            ${ret.pickupId ? `<span class="detail-meta-item"><i class="bi bi-truck"></i>Surat jalan pemulangan <a href="delivery-detail.html?id=${ret.pickupId}">${ret.sjNo}</a></span>` : ''}
            <span class="detail-meta-item"><i class="bi bi-folder"></i>${ret.projectName}</span>
            <span class="detail-meta-item"><i class="bi bi-people"></i>${ret.customerName}</span>
            <span class="detail-meta-item"><i class="bi bi-calendar"></i>${formatDate(ret.returnDate)}</span>
          </div>
        </div>
      </div>
      <div class="detail-header-actions">
        ${ret.status === 'Completed' && hasMissing && !relatedClaims.length ? '<button class="btn btn-warning btn-sm" onclick="createClaim()"><i class="bi bi-exclamation-triangle me-1"></i>Buat Klaim (Rusak / Hilang)</button>' : ''}
        ${ret.status === 'Inspection' && canDo('Returns', 'Update') ? '<button class="btn btn-success btn-sm" onclick="completeReturn()"><i class="bi bi-check-lg me-1"></i>Selesai Inspeksi</button>' : ''}
      </div>`;

    let body = '';

    // Return Info
    body += `<div class="info-grid mb-4">
      <div class="info-item"><span class="info-label">No. Pengembalian</span><span class="info-value text-mono">${ret.id}</span></div>
      <div class="info-item"><span class="info-label">PO</span><span class="info-value">${(x => x.alloc && x.alloc.length ? [...new Set(x.alloc.map(a => a.rentalId))].map(id => `<a href="rental-detail.html?id=${id}" class="cell-link">${BizLogic.Rental.label(id)}</a>`).join(', ') : x.rentalId ? `<a href="rental-detail.html?id=${x.rentalId}" class="cell-link">${BizLogic.Rental.label(x.rentalId)}</a>` : '-')(ret)}</span></div>
      <div class="info-item"><span class="info-label">Proyek</span><span class="info-value">${ret.projectName}</span></div>
      <div class="info-item"><span class="info-label">Pelanggan</span><span class="info-value">${ret.customerName}</span></div>
      <div class="info-item"><span class="info-label">Tanggal Tiba</span><span class="info-value">${formatDate(ret.returnDate)}</span></div>
      <div class="info-item"><span class="info-label">Diinspeksi oleh</span><span class="info-value">${ret.inspectedBy || 'Belum'}</span></div>
      ${ret.lostNo ? `<div class="info-item"><span class="info-label">Dokumen Hilang</span><span class="info-value"><a href="stock-mutations.html?q=${encodeURIComponent(ret.lostNo)}" class="text-mono">${ret.lostNo}</a></span></div>` : ''}
      ${ret.extraNo ? `<div class="info-item"><span class="info-label">Kepulangan Lebih (Adjustment)</span><span class="info-value"><a href="stock-mutations.html?q=${encodeURIComponent(ret.extraNo)}" class="text-mono">${ret.extraNo}</a></span></div>` : ''}
    </div>`;

    // Equipment Classification Table
    body += `<h6 class="fw-600 mb-3"><i class="bi bi-clipboard-check me-2"></i>Hasil Inspeksi Alat</h6>
    <div class="er-table-wrapper mb-2"><table class="er-table">
      <thead><tr>
        <th>Alat</th><th class="num">Dijemput</th>
        <th><span class="badge-status good">Baik</span></th>
        <th><span class="badge-status damaged">Rusak</span></th>
        <th><span class="badge-status overdue">Hilang</span></th>
        <th title="Unit yang datang melebihi stok proyek"><span class="badge-status reserved">Lebih</span></th>
        <th>Catatan</th>
      </tr></thead>
      <tbody id="classBody">
      ${ret.items.map((item, idx) => `<tr>
        <td class="fw-600">${item.name}</td>
        <td class="num"><strong>${item.sent}</strong></td>
        <td><input type="number" class="form-control form-control-sm" style="width:70px" value="${item.good}" min="0" max="${item.sent}" onchange="validateRow(${idx})"></td>
        <td><input type="number" class="form-control form-control-sm" style="width:70px" value="${item.damaged}" min="0" onchange="validateRow(${idx})"></td>
        <td><input type="number" class="form-control form-control-sm" style="width:70px" value="${item.lost || 0}" min="0" onchange="validateRow(${idx})"></td>
        <td><input type="number" class="form-control form-control-sm row-extra" style="width:70px" value="${item.extra || 0}" min="0" onchange="validateRow(${idx})"></td>
        <td><input type="text" class="form-control form-control-sm" value="${item.damageNotes || ''}" placeholder="Catatan kerusakan..."></td>
      </tr>`).join('')}
      </tbody>
    </table></div>
    ${ret.status !== 'Completed' ? `<div class="fs-12 text-muted mb-3"><i class="bi bi-info-circle me-1"></i><strong>Baik + Rusak + Hilang = Dijemput.</strong>
      <ul class="mb-0 mt-1 ps-4"><li><strong>Rusak</strong> masuk stok rusak gudang, lalu diproses di <a href="stock.html#kondisi">Stok Gudang → Perbaikan</a> (bisa jadi alat lain, mis. pipa dipotong).</li>
      <li><strong>Hilang</strong> keluar dari stok proyek dan diklaim ganti ke pelanggan.</li>
      <li><strong>Lebih</strong> = unit yang datang melebihi stok proyek (mis. stok proyek 15, yang datang 20 → isi 5). Dicatat terpisah sebagai <em>Kepulangan Lebih (adjustment)</em>; laporan pemulangan ke pelanggan tetap sesuai stok proyek.</li>
      <li>Kalau ada alat yang <strong>tidak ikut kembali</strong> (bukan hilang), qty pemulangan dikurangi dan sisanya tetap tercatat di proyek.</li></ul></div>` : ''}
    <div id="validationMsg" class="mb-3"></div>`;

    // Related Claims
    if (relatedClaims.length) {
      body += `<h6 class="fw-600 mb-3"><i class="bi bi-exclamation-triangle me-2"></i>Related Claims</h6>
      <div class="er-table-wrapper mb-4"><table class="er-table"><thead><tr><th>No. Klaim</th><th>Equipment</th><th>Qty</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
      ${relatedClaims.map(c => `<tr><td><a href="claim-detail.html?id=${c.id}" class="cell-link text-mono">${c.id}</a></td><td>${c.equipment}</td><td>${c.quantity}</td><td class="fw-600">${formatRupiah(c.claimAmount)}</td><td>${statusBadge(c.status)}</td><td><a href="claim-detail.html?id=${c.id}" class="btn-action"><i class="bi bi-eye"></i></a></td></tr>`).join('')}
      </tbody></table></div>`;
    }

    // Activity
    body += `<h6 class="fw-600 mb-3"><i class="bi bi-clock-history me-2"></i>Aktivitas</h6>`;
    body += renderActivityTimeline([
      { time: '09:00', date: ret.returnDate, action: `Pengembalian ${ret.id} tiba di gudang`, user: 'Gudang', type: 'info' },
      ...(ret.status === 'Completed' ? [{ time: '11:00', date: ret.returnDate, action: 'Inspeksi selesai', user: ret.inspectedBy, type: 'success' }] : []),
    ]);

    document.getElementById('detailBody').innerHTML = body;
    // Hasil inspeksi yang sudah selesai tidak bisa diubah lagi
    if (ret.status === 'Completed') document.querySelectorAll('#classBody input').forEach(el => el.disabled = true);

    function validateAllRows() {
      let isValid = true;
      const rows = document.querySelectorAll('#classBody tr');
      for (let idx = 0; idx < rows.length; idx++) {
        const row = rows[idx];
        const inputs = row.querySelectorAll('input[type="number"]:not(.row-extra)');
        const sent = ret.items[idx].sent;
        const total = Array.from(inputs).reduce((s, i) => s + Number(i.value), 0);

        if (total !== sent) {
          isValid = false;
        }
      }
      return isValid;
    }

    function validateRow(idx) {
      const row = document.querySelectorAll('#classBody tr')[idx];
      if (!row) return;
      const inputs = row.querySelectorAll('input[type="number"]:not(.row-extra)');
      const sent = ret.items[idx].sent;
      const total = Array.from(inputs).reduce((s, i) => s + Number(i.value), 0);
      const msg = document.getElementById('validationMsg');
      if (total > sent) {
        msg.innerHTML = `<div class="alert alert-danger py-2 fs-12"><i class="bi bi-exclamation-triangle me-1"></i><strong>${ret.items[idx].name}</strong>: baik + rusak + hilang (${total}) melebihi qty dijemput (${sent}). Unit yang datang lebih isi di kolom <strong>Lebih</strong>.</div>`;
      } else if (total < sent) {
        msg.innerHTML = `<div class="alert alert-warning py-2 fs-12"><i class="bi bi-info-circle me-1"></i><strong>${ret.items[idx].name}</strong>: ${sent - total} unit tidak ikut kembali, tetap tercatat di proyek.</div>`;
      } else {
        msg.innerHTML = '';
      }
    }

    function createClaim() {
      const res = BizLogic.Claim.createFromReturn(ret.id);
      if (!res.success) { showToast(res.error, 'warning'); return; }
      showToast(res.claims.length + ' klaim dibuat (' + res.claims.map(c => c.id).join(', ') + ')', 'success');
      setTimeout(() => window.location.href = res.claims.length === 1 ? 'claim-detail.html?id=' + res.claims[0].id : 'claims.html', 800);
    }

    function completeReturn() {
      const rowsEl = document.querySelectorAll('#classBody tr');
      const cls = ret.items.map((item, idx) => {
        const inputs = rowsEl[idx].querySelectorAll('input[type="number"]');
        return { name: item.name, sent: item.sent, good: Number(inputs[0].value) || 0, damaged: Number(inputs[1].value) || 0, lost: Number(inputs[2].value) || 0, extra: Number(inputs[3].value) || 0, damageNotes: rowsEl[idx].querySelector('input[type="text"]').value };
      });
      const used = c => c.good + c.damaged + c.lost;
      const over = cls.filter(c => used(c) > c.sent);
      if (over.length) { showToast(over.map(c => c.name + ': baik + rusak + hilang melebihi qty dijemput (isi kelebihan di kolom Lebih)').join('<br>'), 'danger'); return; }
      const short = cls.filter(c => used(c) < c.sent);
      if (short.length && !confirm(short.map(c => `${c.name}: ${c.sent - used(c)} unit tidak ikut kembali`).join('\n') + '\n\nQty pemulangan dikurangi, sisanya tetap tercatat di proyek. Lanjutkan?')) return;
      short.forEach(c => BizLogic.Return.adjustQty(ret.id, c.name, used(c)));
      const extraOnly = cls.filter(c => c.extra > 0 && !ret.items.some(i => i.name === c.name)).map(c => ({ name: c.name, qty: c.extra }));
      if (!ret.items.length && !extraOnly.length) { showToast('Tidak ada alat yang kembali', 'warning'); setTimeout(() => location.reload(), 800); return; }
      const classifiedItems = ret.items.map(it => { const c = cls.find(x => x.name === it.name); return { good: c.good, damaged: c.damaged, lost: c.lost, extra: c.extra, damageNotes: c.damageNotes }; });

      const result = BizLogic.Return.completeInspection(ret.id, classifiedItems, extraOnly);
      if (result.success) {
        showToast('Inspeksi selesai, stok masuk gudang', 'success');
        setTimeout(() => location.reload(), 800);
      } else {
        showToast(result.error, 'danger');
      }
    }
  </script>
</body>

</html>
