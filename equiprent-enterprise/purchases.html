<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchases — EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header"><div class="page-header-left"><h2 class="page-header-title">Purchases</h2><p class="page-header-subtitle">Manage purchase orders and vendor relations</p></div>
        <div class="page-header-actions"><a href="purchase-create.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>New Purchase</a></div></div>
        <div class="er-card"><div class="er-card-body">
          <div class="table-toolbar"><div class="table-toolbar-left">
            <div class="table-search"><i class="bi bi-search"></i><input type="text" placeholder="Search POs..." id="searchInput" oninput="filterData()"></div>
            <select class="filter-select" id="statusFilter" onchange="filterData()"><option value="">All Status</option><option>Draft</option><option>Approved</option><option>Ordered</option><option>Partially Received</option><option>Received</option></select>
          </div></div>
          <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>PO Number</th><th>Vendor</th><th>Date</th><th>Expected Date</th><th>Items</th><th>Total Amount</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tableBody"></tbody></table></div>
        </div></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('purchases.html',[{label:'Inventory',href:'#'},{label:'Purchases'}],'Purchases');
    function filterData(){
      const q=document.getElementById('searchInput').value.toLowerCase();
      const s=document.getElementById('statusFilter').value;
      const data=MockData.purchases.filter(p=>{
        if(q&&!p.id.toLowerCase().includes(q)&&!p.vendor.toLowerCase().includes(q))return false;
        if(s&&p.status!==s)return false;return true;
      });
      document.getElementById('tableBody').innerHTML=data.map(p=>`<tr>
        <td><a href="purchase-detail.html?id=${p.id}" class="cell-link text-mono">${p.id}</a></td>
        <td>${p.vendor}</td><td>${formatDate(p.poDate)}</td><td>${formatDate(p.expectedDate)}</td>
        <td>${p.items.length} types</td><td class="fw-600">${formatRupiah(p.totalAmount)}</td>
        <td>${statusBadge(p.status)}</td>
        <td><a href="purchase-detail.html?id=${p.id}" class="btn-action"><i class="bi bi-eye"></i></a></td>
      </tr>`).join('')||'<tr><td colspan="8" class="text-center text-muted py-4">No purchases found</td></tr>';
    }
    filterData();
  </script>
</body>
</html>
