<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Projects</h2><p class="page-header-subtitle">Manage rental projects</p></div>
          <div class="page-header-actions"><a href="project-create.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>New Project</a></div>
        </div>
        <div class="er-card">
          <div class="er-card-body">
            <div class="table-toolbar">
              <div class="table-toolbar-left">
                <div class="table-search"><i class="bi bi-search"></i><input type="text" placeholder="Search projects..." id="searchInput" oninput="filterData()"></div>
                <select class="filter-select" id="statusFilter" onchange="filterData()"><option value="">All Status</option><option>Active</option><option>Planning</option><option>Completed</option></select>
              </div>
            </div>
            <div class="er-table-wrapper">
              <table class="er-table"><thead><tr><th>Project #</th><th>Project Name</th><th>Customer</th><th>Start Date</th><th>End Date</th><th>Rentals</th><th>Equipment</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="tableBody"></tbody></table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('projects.html',[{label:'Rental',href:'#'},{label:'Projects'}],'Projects');
    function filterData(){
      const q=document.getElementById('searchInput').value.toLowerCase();
      const s=document.getElementById('statusFilter').value;
      const data=MockData.projects.filter(p=>{
        if(q&&!p.id.toLowerCase().includes(q)&&!p.name.toLowerCase().includes(q)&&!p.customerName.toLowerCase().includes(q))return false;
        if(s&&p.status!==s)return false;return true;
      });
      document.getElementById('tableBody').innerHTML=data.map(p=>`<tr>
        <td><a href="project-detail.html?id=${p.id}" class="cell-link text-mono">${p.id}</a></td>
        <td><a href="project-detail.html?id=${p.id}" class="cell-link">${p.name}</a></td>
        <td>${p.customerName}</td><td>${formatDate(p.startDate)}</td><td>${formatDate(p.endDate)}</td>
        <td>${p.totalRentals}</td><td>${p.activeEquipment}</td><td>${statusBadge(p.status)}</td>
        <td><a href="project-detail.html?id=${p.id}" class="btn-action"><i class="bi bi-eye"></i></a></td>
      </tr>`).join('')||'<tr><td colspan="9" class="text-center text-muted py-4">No projects found</td></tr>';
    }
    filterData();
  </script>
</body>
</html>
