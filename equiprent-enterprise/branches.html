<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branches — EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header"><div class="page-header-left"><h2 class="page-header-title">Branches</h2><p class="page-header-subtitle">Warehouse and branch management</p></div>
        <div class="page-header-actions"><button class="btn btn-primary btn-sm" onclick="showToast('Add branch','info')"><i class="bi bi-plus-lg me-1"></i>Add Branch</button></div></div>
        <div class="er-card"><div class="er-card-body">
          <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Code</th><th>Branch Name</th><th>Address</th><th>Capacity</th><th>Total Equipment</th><th>Available</th><th>On Rental</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tableBody"></tbody></table></div>
        </div></div>
      </div>
    </main>
  </div>

  <!-- Add Branch Modal -->
  <div class="modal fade" id="addBranchModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="branchForm" class="needs-validation" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Add New Branch</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label form-label-er">Branch Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control text-uppercase" id="brCode" required placeholder="e.g. JKT">
                <div class="invalid-feedback">Branch code is required.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Status</label>
                <select class="form-select" id="brStatus">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label form-label-er">Branch Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="brName" required placeholder="e.g. Jakarta Warehouse">
                <div class="invalid-feedback">Branch name is required.</div>
              </div>
              <div class="col-12">
                <label class="form-label form-label-er">Capacity (Items) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="brCapacity" required min="1" value="500">
                <div class="invalid-feedback">Capacity is required.</div>
              </div>
              <div class="col-12">
                <label class="form-label form-label-er">Full Address</label>
                <textarea class="form-control" id="brAddress" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Branch</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('branches.html',[{label:'Inventory',href:'#'},{label:'Branches'}],'Branches');

    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-toggle', 'modal');
    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-target', '#addBranchModal');
    document.querySelector('.page-header-actions .btn-primary').removeAttribute('onclick');

    document.getElementById('branchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        e.stopPropagation();
        this.classList.add('was-validated');
        return;
      }

      const newBr = {
        id: MockData.generateId('BR', 'branches'),
        code: document.getElementById('brCode').value.toUpperCase(),
        name: document.getElementById('brName').value,
        address: document.getElementById('brAddress').value,
        capacity: parseInt(document.getElementById('brCapacity').value) || 0,
        totalEquipment: 0,
        available: 0,
        onRental: 0,
        status: document.getElementById('brStatus').value
      };

      MockData.branches.push(newBr);
      MockData.save('branches');

      bootstrap.Modal.getInstance(document.getElementById('addBranchModal')).hide();
      showToast('Branch successfully added.', 'success');
      
      this.reset();
      this.classList.remove('was-validated');
      
      renderTable();
    });

    function renderTable() {
      document.getElementById('tableBody').innerHTML=MockData.branches.map(b=>`<tr>
        <td class="text-mono fw-600">${b.code}</td>
        <td><a href="branch-detail.html?id=${b.id}" class="cell-link">${b.name}</a></td>
        <td class="fs-12">${b.address}</td><td>${b.capacity}</td><td>${b.totalEquipment}</td>
        <td><span class="badge-status available">${b.available}</span></td>
        <td><span class="badge-status on-rental">${b.onRental}</span></td>
        <td>${statusBadge(b.status)}</td>
        <td><a href="branch-detail.html?id=${b.id}" class="btn-action"><i class="bi bi-eye"></i></a><button class="btn-action"><i class="bi bi-pencil"></i></button></td>
      </tr>`).join('');
    }
    renderTable();
  </script>
</body>
</html>
