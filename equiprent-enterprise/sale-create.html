<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penjualan Baru - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Penjualan Baru</h2><p class="page-header-subtitle">Setelah diajukan, order di-ACC Staff Piutang. Stok dipesan saat ACC.</p></div>
        </div>
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="er-card mb-4"><div class="er-card-body">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label form-label-er">Pelanggan *</label><select class="form-select" id="fCustomer" onchange="onCustomer()"></select></div>
                <div class="col-md-6"><label class="form-label form-label-er">Proyek <span class="text-muted fw-normal">(opsional)</span></label><select class="form-select" id="fProject"></select></div>
                <div class="col-md-4"><label class="form-label form-label-er">Tanggal *</label><input type="date" class="form-control" id="fDate"></div>
                <div class="col-md-4"><label class="form-label form-label-er">Gudang Asal *</label><select class="form-select" id="fBranch" onchange="renderItems()"></select></div>
                <div class="col-md-4"><label class="form-label form-label-er">PPN</label><select class="form-select" id="fTax" onchange="calc()"><option value="0.11">PPN 11%</option><option value="0">Tanpa PPN</option></select></div>
              </div>
            </div></div>
            <div class="er-card"><div class="er-card-body">
              <div class="d-flex justify-content-between align-items-center mb-2"><h6 class="fw-600 mb-0">Alat yang Dijual</h6><button class="btn btn-sm btn-outline-primary" onclick="addRow()"><i class="bi bi-plus-lg me-1"></i>Tambah Alat</button></div>
              <div class="er-table-wrapper"><table class="er-table">
                <thead><tr><th>Alat</th><th class="num" style="width:110px">Tersedia</th><th style="width:110px">Qty</th><th style="width:180px">Harga Satuan</th><th class="num">Subtotal</th><th style="width:40px"></th></tr></thead>
                <tbody id="itemBody"></tbody>
              </table></div>
              <div class="mt-3"><label class="form-label form-label-er">Catatan</label><textarea class="form-control" rows="2" id="fNotes"></textarea></div>
            </div></div>
          </div>
          <div class="col-lg-4">
            <div class="er-card"><div class="er-card-body">
              <h6 class="fw-600 mb-3">Ringkasan</h6>
              <table class="w-100 mb-3"><tr><td class="text-muted py-1">Subtotal</td><td class="text-end py-1" id="sSub"></td></tr>
                <tr><td class="text-muted py-1">PPN</td><td class="text-end py-1" id="sTax"></td></tr>
                <tr class="border-top"><td class="fw-600 py-1">Total</td><td class="text-end fw-700 py-1" id="sTotal" style="color:var(--primary)"></td></tr></table>
              <div id="creditInfo" class="mb-3"></div>
              <button class="btn btn-primary w-100 mb-2" onclick="save(true)"><i class="bi bi-send me-1"></i>Ajukan ACC Staff Piutang</button>
              <button class="btn btn-outline-secondary w-100" onclick="save(false)"><i class="bi bi-save me-1"></i>Simpan Draft</button>
            </div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('sale-create.html', [{label:'Pelanggan & Order',href:'#'},{label:'Penjualan',href:'sales.html'},{label:'Baru'}], 'Penjualan Baru');
    const SL = BizLogic.StockLedger;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const names = SL.equipmentNames();
    let rows = [{ name: '', qty: 1, unitPrice: 0 }];
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('fCustomer').innerHTML = '<option value="">- Pilih pelanggan -</option>' + MockData.customers.filter(c => c.status === 'Active').map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    document.getElementById('fBranch').innerHTML = SL.warehouses().map(w => `<option value="${SL.warehouseShort(w)}">${esc(w.name)}</option>`).join('');
    if (getUrlParam('customer')) document.getElementById('fCustomer').value = getUrlParam('customer');

    function onCustomer() {
      const cid = document.getElementById('fCustomer').value;
      document.getElementById('fProject').innerHTML = '<option value="">- Tanpa proyek -</option>' + MockData.projects.filter(p => p.customerId === cid).map(p => `<option value="${p.id}">${esc(p.id + ' · ' + p.name)}</option>`).join('');
      if (getUrlParam('project')) document.getElementById('fProject').value = getUrlParam('project');
      const box = document.getElementById('creditInfo');
      if (!cid) { box.innerHTML = ''; return; }
      const cs = BizLogic.Customer.summary(cid);
      box.innerHTML = `<div class="alert ${cs.overdue ? 'alert-danger' : 'alert-light border'} py-2 fs-12 mb-0"><strong>Piutang pelanggan:</strong> ${formatRupiah(cs.outstanding)}${cs.overdue ? `<br><strong>${formatRupiah(cs.overdue)} lewat jatuh tempo</strong>` : ''}<br>${cs.projects.length} proyek · ${cs.activeRentals.length} sewa aktif</div>`;
    }

    function renderItems() {
      const br = document.getElementById('fBranch').value;
      document.getElementById('itemBody').innerHTML = rows.map((r, i) => {
        const avail = r.name ? BizLogic.Stock.getAvailable(r.name, br) : null;
        return `<tr>
          <td><select class="form-select form-select-sm" onchange="setRow(${i}, 'name', this.value)"><option value="">- pilih alat -</option>${names.map(n => `<option${n === r.name ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></td>
          <td class="num ${avail != null && avail < r.qty ? 'text-danger fw-600' : ''}">${avail == null ? '-' : avail}</td>
          <td><input type="number" min="1" class="form-control form-control-sm" value="${r.qty}" oninput="setRow(${i}, 'qty', this.value, true)"></td>
          <td><input type="number" min="0" class="form-control form-control-sm text-end" value="${r.unitPrice || ''}" oninput="setRow(${i}, 'unitPrice', this.value, true)"></td>
          <td class="num fw-600" id="sub${i}">${formatRupiah(Math.round(r.qty * r.unitPrice))}</td>
          <td>${rows.length > 1 ? `<button class="btn-action" onclick="rows.splice(${i}, 1); renderItems()"><i class="bi bi-x-lg"></i></button>` : ''}</td></tr>`;
      }).join('');
      calc();
    }
    function setRow(i, k, v, quiet) {
      rows[i][k] = k === 'name' ? v : Number(v) || 0;
      if (k === 'name' && v && !rows[i].unitPrice) rows[i].unitPrice = (SL.defaultRate(v) || 0) * 10; // harga awal = nilai ganti alat
      if (quiet) { document.getElementById('sub' + i).textContent = formatRupiah(Math.round(rows[i].qty * rows[i].unitPrice)); calc(); }
      else renderItems();
    }
    function addRow() { rows.push({ name: '', qty: 1, unitPrice: 0 }); renderItems(); }
    function calc() {
      const sub = BizLogic.Sale.subtotal(rows), tax = Math.round(sub * Number(document.getElementById('fTax').value));
      document.getElementById('sSub').textContent = formatRupiah(sub);
      document.getElementById('sTax').textContent = formatRupiah(tax);
      document.getElementById('sTotal').textContent = formatRupiah(sub + tax);
    }
    function save(submit) {
      const r = BizLogic.Sale.create({
        customerId: document.getElementById('fCustomer').value, projectId: document.getElementById('fProject').value || null,
        branch: document.getElementById('fBranch').value, date: document.getElementById('fDate').value,
        items: rows, notes: document.getElementById('fNotes').value, taxRate: Number(document.getElementById('fTax').value)
      }, submit);
      if (!r.success) { showToast(r.error, 'error'); return; }
      showToast('Penjualan ' + r.sale.id + (submit ? ' diajukan ke Staff Piutang' : ' disimpan sebagai draft'), 'success');
      setTimeout(() => location.href = 'sale-detail.html?id=' + r.sale.id, 700);
    }
    onCustomer(); renderItems();
  </script>
</body>
</html>
