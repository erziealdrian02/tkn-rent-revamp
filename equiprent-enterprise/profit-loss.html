<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laba Rugi - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Laba Rugi</h2><p class="page-header-subtitle">Penjualan dari data AR, persediaan dari data stok, biaya dari buku besar</p></div>
          <div class="page-header-actions no-print">
            <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()"><i class="bi bi-download me-1"></i>Export CSV</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i>Cetak</button>
          </div>
        </div>
        <div id="flowBar"></div>

        <div class="er-card mb-4 no-print"><div class="er-card-body">
          <div class="table-toolbar mb-0"><div class="table-toolbar-left flex-wrap">
            <label class="fs-13 text-muted">Periode</label>
            <select class="filter-select" id="fYear" onchange="render()"></select>
            <select class="filter-select" id="fMonth" onchange="render()"></select>
            <select class="filter-select" id="fMode" onchange="render()">
              <option value="all">2. Keseluruhan (semua penjualan & biaya)</option>
              <option value="project">1. Per proyek berjalan</option>
              <option value="compare">Perbandingan antar proyek</option>
            </select>
            <select class="filter-select d-none" id="fProject" onchange="render()"></select>
          </div></div>
        </div></div>

        <div class="row g-3 mb-4" id="kpis"></div>
        <div class="er-card"><div class="er-card-body" id="report"></div></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/accounting.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('profit-loss.html', [{label:'Akuntansi',href:'#'},{label:'Laba Rugi'}], 'Laba Rugi');
    const AC = BizLogic.Accounting;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const rp = v => v < 0 ? `<span class="neg">(${formatRupiah(-v)})</span>` : formatRupiah(v);
    const num = v => !v ? '<span class="is-zero">-</span>' : v < 0 ? `<span class="neg">(${formatNumber(-v)})</span>` : formatNumber(v);
    document.getElementById('flowBar').innerHTML = AC.flowBar('profit-loss.html');
    AC.fillPeriod(document.getElementById('fYear'), document.getElementById('fMonth'));
    document.getElementById('fProject').innerHTML = MockData.projects.map(p => `<option value="${p.id}">${esc(p.id + ' · ' + p.name)}</option>`).join('');
    if (getUrlParam('mode')) document.getElementById('fMode').value = getUrlParam('mode');
    if (getUrlParam('project')) { document.getElementById('fMode').value = 'project'; document.getElementById('fProject').value = getUrlParam('project'); }
    let current = null;

    const accLink = (a, to, projectId) => `<span class="acc-code">${a.code}</span><a href="general-ledger.html?account=${encodeURIComponent(a.id)}&to=${to}">${esc(a.name)}</a>`;

    function kpis(pl) {
      document.getElementById('kpis').innerHTML = [
        ['blue', 'bi-receipt', 'A. Pendapatan', pl.revenueTotal], ['orange', 'bi-boxes', 'B. HPP', pl.hpp.total],
        ['red', 'bi-dash-circle', 'D. Total Biaya', pl.expenseTotal], [pl.net >= 0 ? 'green' : 'red', 'bi-graph-up-arrow', pl.net >= 0 ? 'E. Laba Bersih' : 'E. Rugi Bersih', pl.net]
      ].map(([c, i, l, v]) => `<div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-icon ${c}"><i class="bi ${i}"></i></div><div class="kpi-content"><div class="kpi-value fs-5">${rp(v)}</div><div class="kpi-label">${l}</div></div></div></div>`).join('');
    }

    // Format Laba Rugi (sheet "FORMAT LR"): kolom rincian + kolom total
    function single(pl, title) {
      const to = pl.to, h = pl.hpp, project = pl.projectId;
      const row = (label, detail, total, cls = '', note = '') => `<tr class="${cls}"><td>${label}${note ? ` <span class="fs-11 text-muted">${note}</span>` : ''}</td><td class="num">${detail == null ? '' : rp(detail)}</td><td class="num">${total == null ? '' : rp(total)}</td></tr>`;
      const sec = label => `<tr class="sec-row"><td colspan="3">${label}</td></tr>`;
      let html = sec('A. PENDAPATAN <span class="fs-11 fw-normal text-muted">(data penjualan / AR)</span>');
      html += pl.revenue.map(r => row('<span class="ind-1 d-inline-block">' + accLink(r.account, to) + '</span>', r.amount, null)).join('') || row('<span class="ind-1 d-inline-block text-muted">Belum ada penjualan</span>', null, null);
      html += row('Total Pendapatan (A)', null, pl.revenueTotal, 'total-row');
      html += sec('HARGA POKOK PENJUALAN <span class="fs-11 fw-normal text-muted">(data stok' + (project ? ' proyek' : '') + ')</span>');
      html += row('<span class="ind-1 d-inline-block">Persediaan awal</span>', h.opening, null);
      html += row('<span class="ind-1 d-inline-block">' + h.purchasesLabel + '</span>', h.purchases, null);
      html += row('<span class="ind-1 d-inline-block">Barang tersedia untuk dijual</span>', h.available, null, 'total-row');
      html += row('<span class="ind-1 d-inline-block">Persediaan akhir <a href="stock-report.html" class="fs-11">(stok s/d ' + formatDate(to) + ')</a></span>', -h.closing, null);
      html += h.others.map(r => row('<span class="ind-1 d-inline-block">' + accLink(r.account, to) + '</span>', r.amount, null)).join('');
      html += row('B. HPP', null, h.total, 'total-row');
      html += row('C. LABA KOTOR (A − B)', null, pl.gross, 'grand-row');
      html += sec('BIAYA <span class="fs-11 fw-normal text-muted">(buku besar' + (project ? ', ditandai proyek ini' : '') + ')</span>');
      html += pl.expenses.map(r => row('<span class="ind-1 d-inline-block">' + accLink(r.account, to) + '</span>', r.amount, null)).join('') || row('<span class="ind-1 d-inline-block text-muted">Belum ada biaya</span>', null, null);
      html += row('D. TOTAL BIAYA', null, pl.expenseTotal, 'total-row');
      if (pl.other.length) {
        html += sec('PENDAPATAN & BIAYA LAIN-LAIN');
        html += pl.other.map(r => row('<span class="ind-1 d-inline-block">' + accLink(r.account, to) + '</span>', r.amount, null)).join('');
        html += row('Total Pendapatan / (Biaya) Lain-lain', null, pl.otherTotal, 'total-row');
      }
      html += row(`E. ${pl.net >= 0 ? 'LABA' : 'RUGI'} BERSIH (C − D${pl.other.length ? ' ± lain-lain' : ''})`, null, pl.net, 'grand-row');
      document.getElementById('report').innerHTML = `
        <div class="text-center mb-3"><h5 class="fw-700 mb-0">${esc(MockData.company.name)}</h5>
          <div class="fw-600">LAPORAN LABA RUGI PER ${AC.monthName(Number(to.substr(5, 2))).toUpperCase()} ${to.substr(0, 4)}</div>
          <div class="fs-13 text-muted">${esc(title)} · ${AC.periodText(to)}</div></div>
        <div class="er-table-wrapper"><table class="er-table fin-report mx-auto" style="max-width:860px">
          <thead><tr><th>Keterangan</th><th class="num" style="width:190px">Rincian</th><th class="num" style="width:190px">Jumlah</th></tr></thead>
          <tbody>${html}</tbody></table></div>
        ${project ? '<p class="fs-12 text-muted mt-2 mb-0 text-center"><i class="bi bi-info-circle me-1"></i>HPP proyek = nilai alat yang hilang / tidak kembali dari lokasi proyek. Biaya yang belum ditandai proyek tidak ikut — tandai di menu <a href="journal.html">Jurnal</a>.</p>' : ''}`;
    }

    // Perbandingan per proyek: kolom = proyek aktif + Umum (tanpa proyek) + Total
    function compare(to) {
      const total = AC.profitLoss(to), projects = AC.activeProjects(to);
      const cols = projects.map(p => ({ key: p.id, label: p.id, title: p.name, pl: AC.profitLoss(to, p.id) }));
      const pick = (pl, list, id) => (pl[list].find(r => r.account.id === id) || { amount: 0 }).amount;
      const metric = (pl, k) => k === 'hpp' ? pl.hpp.total : pl[k];
      const overhead = (fn) => fn(total) - cols.reduce((s, c) => s + fn(c.pl), 0);
      const accs = list => { const m = {}; [total].concat(cols.map(c => c.pl)).forEach(pl => pl[list].forEach(r => m[r.account.id] = r.account)); return Object.values(m).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true })); };
      const line = (label, fn, cls = '') => `<tr class="${cls}"><td class="text-nowrap">${label}</td>${cols.map(c => `<td class="num">${num(fn(c.pl))}</td>`).join('')}<td class="num">${num(overhead(fn))}</td><td class="num fw-600">${num(fn(total))}</td></tr>`;
      let html = `<tr class="sec-row"><td colspan="${cols.length + 3}">A. PENDAPATAN</td></tr>`;
      html += accs('revenue').map(a => line(`<span class="ind-1 d-inline-block"><span class="acc-code">${a.code}</span>${esc(a.name)}</span>`, pl => pick(pl, 'revenue', a.id))).join('');
      html += line('Total Pendapatan (A)', pl => pl.revenueTotal, 'total-row');
      html += line('B. HPP', pl => pl.hpp.total, 'total-row');
      html += line('C. LABA KOTOR', pl => pl.gross, 'grand-row');
      html += `<tr class="sec-row"><td colspan="${cols.length + 3}">BIAYA</td></tr>`;
      html += accs('expenses').map(a => line(`<span class="ind-1 d-inline-block"><span class="acc-code">${a.code}</span>${esc(a.name)}</span>`, pl => pick(pl, 'expenses', a.id))).join('');
      html += line('D. TOTAL BIAYA', pl => pl.expenseTotal, 'total-row');
      if (accs('other').length) html += line('Pendapatan / (Biaya) Lain-lain', pl => pl.otherTotal, 'total-row');
      html += line('E. LABA / RUGI BERSIH', pl => pl.net, 'grand-row');
      html += `<tr class="fs-12 text-muted"><td>Margin bersih</td>${cols.map(c => `<td class="num">${c.pl.revenueTotal ? Math.round(c.pl.net / c.pl.revenueTotal * 100) + '%' : '-'}</td>`).join('')}<td></td><td class="num">${total.revenueTotal ? Math.round(total.net / total.revenueTotal * 100) + '%' : '-'}</td></tr>`;
      document.getElementById('report').innerHTML = `
        <div class="text-center mb-3"><h5 class="fw-700 mb-0">${esc(MockData.company.name)}</h5><div class="fw-600">LABA RUGI PER PROYEK</div><div class="fs-13 text-muted">${AC.periodText(to)}</div></div>
        <div class="er-table-wrapper"><table class="er-table fin-report">
          <thead><tr><th>Keterangan</th>${cols.map(c => `<th class="num" title="${esc(c.title)}"><a href="profit-loss.html?project=${c.key}" class="text-reset">${c.label}</a><div class="fs-11 fw-normal text-muted text-truncate" style="max-width:140px">${esc(c.title)}</div></th>`).join('')}<th class="num">Umum<div class="fs-11 fw-normal text-muted">tanpa proyek</div></th><th class="num">Total</th></tr></thead>
          <tbody>${html}</tbody></table></div>
        <p class="fs-12 text-muted mt-2 mb-0"><i class="bi bi-info-circle me-1"></i>Kolom <b>Umum</b> = total − semua proyek (biaya kantor, penyusutan, HPP barang yang dijual dari gudang, dll.). Klik kode proyek untuk laporan per proyek.</p>`;
      current = { mode: 'compare', to, total, cols, accs, pick, overhead };
      kpis(total);
    }

    function render() {
      const to = AC.periodEnd(document.getElementById('fYear'), document.getElementById('fMonth'));
      const mode = document.getElementById('fMode').value;
      document.getElementById('fProject').classList.toggle('d-none', mode !== 'project');
      if (mode === 'compare') return compare(to);
      const pid = mode === 'project' ? document.getElementById('fProject').value : null;
      const pl = AC.profitLoss(to, pid);
      const p = pid && MockData.projects.find(x => x.id === pid);
      current = { mode, pl, title: p ? p.id + ' ' + p.name : 'Keseluruhan' };
      kpis(pl);
      single(pl, p ? `Proyek ${p.id} · ${p.name} (${p.customerName})` : 'Keseluruhan penjualan dan biaya');
    }

    function exportCSV() {
      if (!current) return;
      if (current.mode === 'compare') {
        const c = current, head = ['Keterangan'].concat(c.cols.map(x => x.label + ' ' + x.title), ['Umum', 'Total']);
        const line = (label, fn) => [label].concat(c.cols.map(x => fn(x.pl)), [c.overhead(fn), fn(c.total)]);
        const rows = [head];
        c.accs('revenue').forEach(a => rows.push(line(a.code + ' ' + a.name, pl => c.pick(pl, 'revenue', a.id))));
        rows.push(line('A. Total Pendapatan', pl => pl.revenueTotal), line('B. HPP', pl => pl.hpp.total), line('C. Laba Kotor', pl => pl.gross));
        c.accs('expenses').forEach(a => rows.push(line(a.code + ' ' + a.name, pl => c.pick(pl, 'expenses', a.id))));
        rows.push(line('D. Total Biaya', pl => pl.expenseTotal), line('Lain-lain', pl => pl.otherTotal), line('E. Laba Bersih', pl => pl.net));
        downloadCSV('laba-rugi-per-proyek-' + c.to + '.csv', rows); return;
      }
      const pl = current.pl, h = pl.hpp, rows = [['Laporan Laba Rugi', current.title], ['Periode', pl.from + ' s/d ' + pl.to], [], ['Keterangan', 'Rincian', 'Jumlah']];
      rows.push(['A. PENDAPATAN']); pl.revenue.forEach(r => rows.push([r.account.code + ' ' + r.account.name, r.amount])); rows.push(['Total Pendapatan', '', pl.revenueTotal]);
      rows.push(['HPP'], ['Persediaan awal', h.opening], [h.purchasesLabel, h.purchases], ['Barang tersedia', h.available], ['Persediaan akhir', -h.closing]);
      h.others.forEach(r => rows.push([r.account.code + ' ' + r.account.name, r.amount]));
      rows.push(['B. HPP', '', h.total], ['C. LABA KOTOR', '', pl.gross], ['BIAYA']);
      pl.expenses.forEach(r => rows.push([r.account.code + ' ' + r.account.name, r.amount])); rows.push(['D. TOTAL BIAYA', '', pl.expenseTotal]);
      pl.other.forEach(r => rows.push([r.account.code + ' ' + r.account.name, r.amount])); rows.push(['E. LABA BERSIH', '', pl.net]);
      downloadCSV('laba-rugi-' + pl.to + '.csv', rows);
    }

    render();
  </script>
</body>
</html>
