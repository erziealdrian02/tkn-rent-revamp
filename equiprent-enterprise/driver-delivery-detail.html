<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Detail - Driver Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar driver-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="er-card mb-4">
          <div class="detail-header" id="detailHeader"></div>
          <div class="er-card-body" id="detailBody"></div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-2 justify-content-center mb-4" id="actionButtons"></div>
      </div>
    </main>
  </div>

  <!-- Arrival Modal -->
  <div class="modal fade" id="arrivalModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-geo-alt me-2"></i>Confirm Arrival</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label form-label-er">Arrival Date & Time</label><input type="datetime-local" class="form-control" id="arrivalTime"></div>
          <div class="mb-3">
            <label class="form-label form-label-er">Upload Photo</label>
            <input type="file" class="form-control" accept="image/*" id="photoUpload" onchange="previewPhoto(this)">
            <div class="mt-2" id="photoPreview"></div>
          </div>
          <div class="mb-3"><label class="form-label form-label-er">Notes</label><textarea class="form-control" rows="2" id="arrivalNotes" placeholder="Arrival notes..."></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success" onclick="confirmArrival()"><i class="bi bi-check-lg me-1"></i>Confirm Arrival</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const did = getUrlParam('id');
    const dlv = myDeliveries().find(d => d.id === did);
    if (!dlv) { location.replace('driver-deliveries.html'); throw new Error('Bukan tugas driver ini'); }
    initApp('driver-deliveries.html',[{label:'My Deliveries',href:'driver-deliveries.html'},{label:dlv.id}],dlv.id);

    // Set default arrival time
    const now = new Date();
    document.getElementById('arrivalTime').value = now.toISOString().slice(0,16);

    let currentStatus = dlv.status;

    function renderPage() {
      document.getElementById('detailHeader').innerHTML = `
        <div class="detail-header-left">
          <div class="detail-header-icon"><i class="bi bi-truck"></i></div>
          <div class="detail-header-info">
            <h2>${dlv.id} ${statusBadge(currentStatus)}</h2>
            <div class="detail-meta">
              <span class="detail-meta-item"><i class="bi bi-people"></i>${dlv.customerName}</span>
              <span class="detail-meta-item"><i class="bi bi-folder"></i>${dlv.projectName}</span>
              <span class="detail-meta-item"><i class="bi bi-calendar"></i>${formatDate(dlv.deliveryDate)}</span>
            </div>
          </div>
        </div>`;

      document.getElementById('detailBody').innerHTML = `
        <div class="row g-4">
          <div class="col-md-6">
            <h6 class="fw-600 mb-3">Delivery Information</h6>
            <div class="info-grid">
              <div class="info-item"><span class="info-label">Customer</span><span class="info-value">${dlv.customerName}</span></div>
              <div class="info-item"><span class="info-label">Project</span><span class="info-value">${dlv.projectName}</span></div>
              <div class="info-item"><span class="info-label">Destination</span><span class="info-value">${dlv.destination}</span></div>
              <div class="info-item"><span class="info-label">Date</span><span class="info-value">${formatDate(dlv.deliveryDate)}</span></div>
              <div class="info-item"><span class="info-label">Notes</span><span class="info-value">${dlv.notes||'-'}</span></div>
            </div>
          </div>
          <div class="col-md-6">
            <h6 class="fw-600 mb-3">Equipment to Deliver</h6>
            <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Equipment</th><th>Qty</th></tr></thead><tbody>
            ${dlv.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td></tr>`).join('')}
            </tbody></table></div>
          </div>
        </div>
        ${dlv.arrivalPhoto || dlv.arrivalNotes ? `<div class="mt-4">
          <h6 class="fw-600 mb-2">Laporan Kedatangan</h6>
          <div class="p-3 border rounded" style="background:var(--bg-table-stripe)">
            ${dlv.arrivalPhoto ? `<img src="${dlv.arrivalPhoto}" alt="Arrival photo" style="max-width:300px;border-radius:var(--border-radius)">` : ''}
            ${dlv.arrivalNotes ? `<p class="mt-2 mb-0">${dlv.arrivalNotes}</p>` : ''}
            <p class="fs-12 text-muted mt-2 mb-0">Sampai: ${dlv.arrivedAt || '-'}</p>
          </div>
        </div>` : ''}`;

      // Tombol aksi driver
      let btns = '';
      if (currentStatus === 'Assigned') {
        btns = `<button class="btn btn-primary btn-lg" onclick="depart()"><i class="bi bi-truck me-2"></i>BERANGKAT</button>`;
      } else if (currentStatus === 'Departed') {
        btns = `<button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#arrivalModal"><i class="bi bi-geo-alt me-2"></i>SAMPAI</button>`;
      } else if (currentStatus === 'Arrived') {
        btns = `<div class="alert alert-info"><i class="bi bi-hourglass-split me-2"></i>Sudah sampai. Menunggu serah terima (PoD) dicatat admin.</div>`;
      } else if (currentStatus === 'Completed') {
        btns = `<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Serah terima selesai${dlv.proofOfDelivery ? ' — diterima ' + dlv.proofOfDelivery.receiverName : ''}</div>`;
      } else if (currentStatus === 'Failed') {
        btns = `<div class="alert alert-danger"><i class="bi bi-x-circle me-2"></i>Pengiriman gagal: ${(dlv.failureInfo || {}).reason || '-'}</div>`;
      } else {
        btns = `<div class="alert alert-light border"><i class="bi bi-clock me-2"></i>Menunggu jadwal & penugasan dari admin.</div>`;
      }
      document.getElementById('actionButtons').innerHTML = btns;
    }

    function depart() {
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Departed');
      if (!res.success) { showToast(res.error, 'error'); return; }
      currentStatus = dlv.status;
      showToast('Status updated: Departed', 'success');
      renderPage();
    }

    // Kecilkan foto (maks 800px, JPEG) supaya muat disimpan di browser
    function shrinkPhoto(file) {
      return new Promise(resolve => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 800 / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.7));
          };
          img.onerror = () => resolve(null);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function previewPhoto(input) {
      const preview = document.getElementById('photoPreview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" style="max-width:200px;border-radius:var(--border-radius);border:1px solid var(--border-color)" alt="Preview">`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function confirmArrival() {
      const photoInput = document.getElementById('photoUpload');
      const photo = await shrinkPhoto(photoInput.files && photoInput.files[0]);
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Arrived', {
        arrivedAt: document.getElementById('arrivalTime').value.replace('T', ' '),
        arrivalPhoto: photo,
        arrivalNotes: document.getElementById('arrivalNotes').value.trim()
      });
      if (!res.success) { showToast(res.error, 'error'); return; }
      bootstrap.Modal.getInstance(document.getElementById('arrivalModal')).hide();
      currentStatus = dlv.status;
      showToast('Arrival confirmed successfully', 'success');
      renderPage();
    }

    renderPage();
  </script>
</body>
</html>
