<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Order Baru - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-header-title">Purchase Order Baru</h2>
            <p class="page-header-subtitle" id="subtitle">Vendor, barang & satuan, harga, term of payment dan pajak</p>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="er-card mb-4">
              <div class="er-card-header">
                <h5 class="er-card-title">1. Vendor & Informasi PO</h5>
              </div>
              <div class="er-card-body">
                <div class="row g-3">
                  <div class="col-md-4"><label class="form-label form-label-er">No. PO</label><input
                      class="form-control bg-light text-mono" id="poId" readonly></div>
                  <div class="col-md-8"><label class="form-label form-label-er">Vendor * <a href="vendors.html"
                        class="fw-normal ms-1 fs-12">kelola vendor</a></label><select class="form-select" id="fVendor"
                      onchange="showVendor()"></select></div>
                  <div class="col-12">
                    <div class="border rounded p-2 bg-light fs-13" id="vendorInfo"></div>
                  </div>
                  <div class="col-md-4"><label class="form-label form-label-er">Tanggal PO *</label><input type="date"
                      class="form-control" id="fDate"></div>
                  <div class="col-md-4"><label class="form-label form-label-er">Estimasi Tiba</label><input type="date"
                      class="form-control" id="fExpected"></div>
                  <div class="col-md-4"><label class="form-label form-label-er">Gudang Tujuan *</label><select
                      class="form-select" id="fBranch"></select></div>
                </div>
              </div>
            </div>
            <div class="er-card mb-4">
              <div class="er-card-header d-flex justify-content-between align-items-center">
                <h5 class="er-card-title mb-0">2. Barang</h5><button class="btn btn-outline-primary btn-sm"
                  onclick="addRow()"><i class="bi bi-plus-lg me-1"></i>Tambah Barang</button>
              </div>
              <div class="er-card-body p-0">
                <div class="er-table-wrapper">
                  <table class="er-table">
                    <thead>
                      <tr>
                        <th style="min-width:260px">Nama Barang</th>
                        <th style="width:120px">Satuan</th>
                        <th style="width:100px">Qty</th>
                        <th style="width:180px">Harga Satuan</th>
                        <th class="num" style="width:170px">Jumlah</th>
                        <th style="width:40px"></th>
                      </tr>
                    </thead>
                    <tbody id="itemBody"></tbody>
                  </table>
                </div>
              </div>
              <datalist id="eqList"></datalist>
              <datalist id="unitList">
                <option>Unit</option>
                <option>Set</option>
                <option>Pcs</option>
                <option>Roll</option>
                <option>Batang</option>
                <option>Meter</option>
                <option>Lembar</option>
              </datalist>
            </div>
            <div class="er-card mb-4">
              <div class="er-card-header">
                <h5 class="er-card-title">3. Term of Payment</h5>
              </div>
              <div class="er-card-body">
                <div class="d-flex flex-wrap gap-3 mb-3">
                  <label class="d-flex align-items-center gap-2"><input type="radio" name="term" value="CASH"
                      class="form-check-input m-0" onchange="onTerm()"> Cash <span class="fs-12 text-muted">(lunas saat
                      barang diterima)</span></label>
                  <label class="d-flex align-items-center gap-2"><input type="radio" name="term" value="DP"
                      class="form-check-input m-0" onchange="onTerm()"> Uang Muka (DP) + Pelunasan</label>
                  <label class="d-flex align-items-center gap-2"><input type="radio" name="term" value="TEMPO"
                      class="form-check-input m-0" checked onchange="onTerm()"> Tempo</label>
                </div>
                <div class="row g-3">
                  <div class="col-md-4" id="dpWrap"><label class="form-label form-label-er">Uang Muka (%)</label>
                    <div class="input-group"><input type="number" min="1" max="99" class="form-control text-end"
                        id="fDp" value="30" oninput="calc()"><span class="input-group-text">%</span></div>
                    <div class="fs-12 text-muted mt-1" id="dpAmt"></div>
                  </div>
                  <div class="col-md-4" id="daysWrap"><label class="form-label form-label-er" id="daysLabel">Tempo
                      (hari)</label>
                    <div class="input-group"><input type="number" min="0" class="form-control text-end" id="fDays"
                        value="30"><span class="input-group-text">hari</span></div>
                    <div class="fs-12 text-muted mt-1">dihitung dari tanggal barang diterima</div>
                  </div>
                  <div class="col-md-4"><label class="form-label form-label-er">Rekening Pembayaran</label><select
                      class="form-select" id="fAccount"></select></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="er-card" style="position:sticky;top:80px">
              <div class="er-card-header">
                <h5 class="er-card-title">4. Pajak & Total</h5>
              </div>
              <div class="er-card-body">
                <div class="mb-3"><label class="form-label form-label-er">Pajak (Tax)</label><select class="form-select"
                    id="fTax" onchange="calc()">
                    <option value="0.11">PPN 11%</option>
                    <option value="0">Tanpa PPN</option>
                  </select></div>
                <div class="row g-2 mb-3">
                  <div class="col-6"><label class="form-label form-label-er">Diskon</label><input type="number" min="0"
                      class="form-control form-control-sm text-end" id="fDiscount" value="0" oninput="calc()"></div>
                  <div class="col-6"><label class="form-label form-label-er">Ongkos Kirim</label><input type="number"
                      min="0" class="form-control form-control-sm text-end" id="fShipping" value="0" oninput="calc()">
                  </div>
                </div>
                <table class="w-100 mb-3 fs-13">
                  <tr>
                    <td class="text-muted py-1">Subtotal</td>
                    <td class="text-end" id="sSub"></td>
                  </tr>
                  <tr>
                    <td class="text-muted py-1">Diskon</td>
                    <td class="text-end" id="sDisc"></td>
                  </tr>
                  <tr>
                    <td class="text-muted py-1" id="sTaxLabel">PPN</td>
                    <td class="text-end" id="sTax"></td>
                  </tr>
                  <tr>
                    <td class="text-muted py-1">Ongkos kirim</td>
                    <td class="text-end" id="sShip"></td>
                  </tr>
                  <tr class="border-top">
                    <td class="fw-600 py-1">Total PO</td>
                    <td class="text-end fw-700" id="sTotal" style="color:var(--primary)"></td>
                  </tr>
                </table>
                <div class="mb-3"><label class="form-label form-label-er">Catatan</label><textarea class="form-control"
                    rows="2" id="fNotes"></textarea></div>
                <button class="btn btn-primary w-100 mb-2" onclick="save('Requested')"><i
                    class="bi bi-send me-1"></i>Ajukan ACC</button>
                <button class="btn btn-outline-secondary w-100" onclick="save('Draft')"><i
                    class="bi bi-save me-1"></i>Simpan Draft</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('purchase-create.html', [{ label: 'Pembelian', href: '#' }, { label: 'Purchase Order', href: 'purchases.html' }, { label: 'Baru' }], 'Purchase Order Baru');
    const P = BizLogic.Purchase, V = BizLogic.Vendor;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const pr = getUrlParam('pr') ? BizLogic.PurchaseRequest.find(getUrlParam('pr')) : null;
    let rows = [{ name: '', unit: 'Unit', qty: 1, price: 0 }];
    document.getElementById('poId').value = MockData.generateId('PO', 'purchases');
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('fBranch').innerHTML = MockData.branches.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
    document.getElementById('fAccount').innerHTML = MockData.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
    document.getElementById('fVendor').innerHTML = V.options('');
    document.getElementById('eqList').innerHTML = BizLogic.StockLedger.equipmentNames().map(n => `<option value="${esc(n)}">`).join('');
    if (pr) { // tarik dari Purchase Request yang sudah di-ACC
      if (pr.status !== 'Disetujui') showToast(pr.poId ? pr.id + ' sudah dibuat ' + pr.poId : pr.id + ' belum di-ACC (status ' + pr.status + ')', 'warning');
      document.getElementById('subtitle').innerHTML = `Dari Purchase Request <a href="purchase-requests.html?id=${pr.id}">${pr.id}</a> — cek harga lalu tentukan term of payment & pajak`;
      document.getElementById('fVendor').value = pr.vendorId;
      document.getElementById('fBranch').value = pr.branchId;
      document.getElementById('fNotes').value = pr.notes || '';
      rows = pr.items.map(i => Object.assign({}, i));
    } else if (getUrlParam('vendor')) document.getElementById('fVendor').value = getUrlParam('vendor');

    function showVendor() {
      const v = V.find(document.getElementById('fVendor').value);
      document.getElementById('vendorInfo').innerHTML = v
        ? `<div class="row g-2"><div class="col-md-6"><span class="text-muted">Alamat:</span> ${esc(v.address)}</div><div class="col-md-3"><span class="text-muted">Telp:</span> ${esc(v.phone)}</div><div class="col-md-3"><span class="text-muted">CP:</span> ${esc(v.contactPerson)}</div></div>`
        : '<span class="text-muted">Pilih vendor untuk melihat alamat & kontak</span>';
    }
    function drawRows() {
      document.getElementById('itemBody').innerHTML = rows.map((r, i) => `<tr>
        <td><input class="form-control form-control-sm" list="eqList" value="${esc(r.name)}" oninput="setRow(${i}, 'name', this.value)"></td>
        <td><input class="form-control form-control-sm" list="unitList" value="${esc(r.unit)}" oninput="setRow(${i}, 'unit', this.value)"></td>
        <td><input type="number" min="1" class="form-control form-control-sm" value="${r.qty}" oninput="setRow(${i}, 'qty', this.value)"></td>
        <td><input type="number" min="0" class="form-control form-control-sm text-end" value="${r.price || ''}" oninput="setRow(${i}, 'price', this.value)"></td>
        <td class="num fw-600" id="amt${i}">${formatRupiah(r.qty * r.price)}</td>
        <td>${rows.length > 1 ? `<button class="btn-action" onclick="rows.splice(${i}, 1); drawRows()"><i class="bi bi-x-lg"></i></button>` : ''}</td></tr>`).join('');
      calc();
    }
    function setRow(i, k, v) { rows[i][k] = (k === 'qty' || k === 'price') ? Number(v) || 0 : v; const a = document.getElementById('amt' + i); if (a) a.textContent = formatRupiah(rows[i].qty * rows[i].price); calc(); }
    function addRow() { rows.push({ name: '', unit: 'Unit', qty: 1, price: 0 }); drawRows(); }
    const term = () => document.querySelector('input[name="term"]:checked').value;
    function onTerm() {
      const t = term();
      document.getElementById('dpWrap').classList.toggle('d-none', t !== 'DP');
      document.getElementById('daysWrap').classList.toggle('d-none', t === 'CASH');
      document.getElementById('daysLabel').textContent = t === 'DP' ? 'Pelunasan (hari)' : 'Tempo (hari)';
      if (t === 'DP' && document.getElementById('fDays').value === '30') document.getElementById('fDays').value = 0;
      calc();
    }
    function totals() { return P.totals(rows, document.getElementById('fTax').value, document.getElementById('fDiscount').value, document.getElementById('fShipping').value); }
    function calc() {
      const t = totals(), rate = Number(document.getElementById('fTax').value);
      document.getElementById('sSub').textContent = formatRupiah(t.subtotal);
      document.getElementById('sDisc').textContent = t.discount ? '(' + formatRupiah(t.discount) + ')' : '-';
      document.getElementById('sTaxLabel').textContent = rate ? 'PPN ' + Math.round(rate * 100) + '%' : 'Pajak';
      document.getElementById('sTax').textContent = formatRupiah(t.tax);
      document.getElementById('sShip').textContent = formatRupiah(t.shipping);
      document.getElementById('sTotal').textContent = formatRupiah(t.totalAmount);
      document.getElementById('dpAmt').textContent = 'Uang muka ≈ ' + formatRupiah(Math.round(t.totalAmount * (Number(document.getElementById('fDp').value) || 0) / 100));
    }
    function save(status) {
      const t = term();
      const r = P.create({
        vendorId: document.getElementById('fVendor').value, prId: pr ? pr.id : null, branchId: document.getElementById('fBranch').value,
        accountId: document.getElementById('fAccount').value, purchaseDate: document.getElementById('fDate').value, expectedDate: document.getElementById('fExpected').value,
        items: rows, taxRate: document.getElementById('fTax').value, discount: document.getElementById('fDiscount').value, shipping: document.getElementById('fShipping').value,
        paymentTerm: t === 'CASH' ? { type: 'CASH' } : t === 'DP' ? { type: 'DP', dpPercent: Number(document.getElementById('fDp').value), days: Number(document.getElementById('fDays').value) || 0 } : { type: 'TEMPO', days: Number(document.getElementById('fDays').value) || 0 },
        status, notes: document.getElementById('fNotes').value
      });
      if (!r.success) { showToast(r.error, 'error'); return; }
      showToast('Purchase Order ' + r.purchase.id + (status === 'Requested' ? ' diajukan untuk ACC' : ' disimpan sebagai draft'), 'success');
      setTimeout(() => location.href = 'purchase-detail.html?id=' + r.purchase.id, 700);
    }
    showVendor(); drawRows(); onTerm();
  </script>
</body>

</html>
