<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pengiriman - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="er-card mb-4">
          <div class="detail-header" id="detailHeader"></div>
          <div class="er-card-body" id="detailBody"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Proof of Delivery Modal -->
  <div class="modal fade" id="podModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-person-check me-2"></i>Proof of Delivery</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label form-label-er">Receiver Name</label><input type="text" class="form-control" id="podName" required></div>
          <div class="mb-3"><label class="form-label form-label-er">Receiver Phone</label><input type="text" class="form-control" id="podPhone" required></div>
          <div class="mb-3">
            <label class="form-label form-label-er">Signature / Photo Proof</label>
            <div class="d-flex align-items-center justify-content-center bg-light border rounded" style="height:120px; color:var(--text-secondary); border-style:dashed!important;">
              <i class="bi bi-camera me-2"></i> Click to capture photo (Mock)
            </div>
            <small class="text-muted d-block mt-1">In this prototype, this acts as the signature/photo capture.</small>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success" onclick="completeDelivery()"><i class="bi bi-check-lg me-1"></i>Confirm Delivery</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Failed Delivery Modal -->
  <div class="modal fade" id="failModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Report Failure</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label form-label-er">Failure Reason</label>
            <select class="form-select mb-2" id="failReasonType">
              <option>Customer not on site</option>
              <option>Site inaccessible</option>
              <option>Equipment rejected by customer</option>
              <option>Vehicle breakdown</option>
              <option>Other</option>
            </select>
            <textarea class="form-control" id="failReasonText" rows="3" placeholder="Additional details..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-danger" onclick="failDelivery()"><i class="bi bi-x-circle me-1"></i>Report Failure</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const did = getUrlParam('id') || 'DLV-001';
    const dlv = MockData.deliveries.find(d => d.id === did) || MockData.deliveries[0];
    initApp('deliveries.html',[{label:'Rekap Stok',href:'#'},{label:'Pengiriman',href:'deliveries.html'},{label:dlv.id}],dlv.id);

    document.getElementById('detailHeader').innerHTML = `
      <div class="detail-header-left">
        <div class="detail-header-icon"><i class="bi bi-truck"></i></div>
        <div class="detail-header-info">
          <h2>${dlv.id} ${statusBadge(dlv.status)}</h2>
          <div class="detail-meta">
            <span class="detail-meta-item"><i class="bi bi-file-earmark-text"></i><a href="rental-detail.html?id=${dlv.rentalId}">${dlv.rentalId}</a></span>
            <span class="detail-meta-item"><i class="bi bi-people"></i>${dlv.customerName}</span>
            <span class="detail-meta-item"><i class="bi bi-folder"></i><a href="project-detail.html?id=${dlv.projectId}">${dlv.projectName}</a></span>
            <span class="detail-meta-item"><i class="bi bi-calendar"></i>${formatDate(dlv.deliveryDate)}</span>
          </div>
        </div>
      </div>
      <div class="detail-header-actions">
        ${dlv.status === 'Assigned' ? `<button class="btn btn-warning btn-sm" onclick="departDelivery()"><i class="bi bi-truck me-1"></i>Depart</button>` : ''}
        ${dlv.status === 'Departed' ? `<button class="btn btn-info btn-sm" onclick="arriveDelivery()"><i class="bi bi-geo-alt me-1"></i>Arrive at Site</button>
                                       <button class="btn btn-outline-danger btn-sm" onclick="openFailModal()"><i class="bi bi-exclamation-triangle me-1"></i>Report Issue</button>` : ''}
        ${dlv.status === 'Arrived' ? `<button class="btn btn-success btn-sm" onclick="openPodModal()"><i class="bi bi-check-circle me-1"></i>Complete Handover (PoD)</button>
                                      <button class="btn btn-outline-danger btn-sm" onclick="openFailModal()"><i class="bi bi-exclamation-triangle me-1"></i>Report Issue</button>` : ''}
        ${dlv.status === 'Failed' ? `<button class="btn btn-primary btn-sm" onclick="rescheduleDelivery()"><i class="bi bi-arrow-repeat me-1"></i>Reschedule</button>` : ''}
        ${dlv.status === 'Preparing' || dlv.status === 'Rescheduled' ? `<button class="btn btn-primary btn-sm" onclick="openAssign()"><i class="bi bi-person-plus me-1"></i>Tugaskan Driver</button>` : ''}
        <button class="btn btn-outline-secondary btn-sm" onclick="printSJ()"><i class="bi bi-printer me-1"></i>Cetak Surat Jalan</button>
      </div>`;

    document.getElementById('detailBody').innerHTML = `
      <div class="row g-4">
        <div class="col-md-6">
          <h6 class="fw-600 mb-3">Delivery Information</h6>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Delivery Number</span><span class="info-value text-mono">${dlv.id}</span></div>
            <div class="info-item"><span class="info-label">Rental Number</span><span class="info-value"><a href="rental-detail.html?id=${dlv.rentalId}">${dlv.rentalId}</a></span></div>
            <div class="info-item"><span class="info-label">Customer</span><span class="info-value">${dlv.customerName}</span></div>
            <div class="info-item"><span class="info-label">Project</span><span class="info-value">${dlv.projectName}</span></div>
            <div class="info-item"><span class="info-label">Delivery Date</span><span class="info-value">${formatDate(dlv.deliveryDate)}</span></div>
            <div class="info-item"><span class="info-label">Destination</span><span class="info-value">${dlv.destination}</span></div>
            <div class="info-item"><span class="info-label">Status</span><span class="info-value">${statusBadge(dlv.status)}</span></div>
            <div class="info-item"><span class="info-label">Notes</span><span class="info-value">${dlv.notes||'-'}</span></div>
          </div>
        </div>
        <div class="col-md-6">
          <h6 class="fw-600 mb-3">Driver & Vehicle</h6>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Driver</span><span class="info-value">${dlv.driverName?`<a href="driver-detail.html?id=${dlv.driverId}">${dlv.driverName}</a>`:'<span class="text-muted">Tidak Ditugaskan</span>'}</span></div>
            <div class="info-item"><span class="info-label">Vehicle</span><span class="info-value">${dlv.vehiclePlate?`<a href="vehicle-detail.html?id=${dlv.vehicleId}">${dlv.vehiclePlate}</a>`:'-'}</span></div>
          </div>
        </div>
      </div>

      ${dlv.proofOfDelivery ? `
      <div class="alert alert-success mt-4 mb-0">
        <h6 class="alert-heading fw-600 mb-2"><i class="bi bi-person-check me-2"></i>Proof of Delivery (PoD)</h6>
        <div class="row">
          <div class="col-md-4"><strong>Receiver:</strong> ${dlv.proofOfDelivery.receiverName}</div>
          <div class="col-md-4"><strong>Phone:</strong> ${dlv.proofOfDelivery.receiverPhone}</div>
          <div class="col-md-4"><strong>Received At:</strong> ${dlv.completedAt}</div>
        </div>
      </div>` : ''}

      ${dlv.arrivalPhoto || dlv.arrivalNotes ? `
      <div class="alert alert-info mt-4 mb-0">
        <h6 class="alert-heading fw-600 mb-2"><i class="bi bi-camera me-2"></i>Laporan Kedatangan Driver</h6>
        ${dlv.arrivalNotes ? `<p class="mb-2">${dlv.arrivalNotes}</p>` : ''}
        ${dlv.arrivalPhoto ? `<img src="${dlv.arrivalPhoto}" alt="Foto kedatangan" class="rounded border" style="max-width:280px;max-height:200px">` : ''}
      </div>` : ''}

      ${dlv.failureInfo ? `
      <div class="alert alert-danger mt-4 mb-0">
        <h6 class="alert-heading fw-600 mb-2"><i class="bi bi-exclamation-triangle me-2"></i>Delivery Failed</h6>
        <p class="mb-0"><strong>Reason:</strong> ${dlv.failureInfo.reason}</p>
        <p class="mb-0"><strong>Details:</strong> ${dlv.failureInfo.notes || 'None'}</p>
      </div>` : ''}

      <h6 class="fw-600 mt-4 mb-3">Equipment Being Delivered</h6>
      <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Equipment</th><th>Quantity</th></tr></thead><tbody>
      ${dlv.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td></tr>`).join('')}
      </tbody></table></div>

      <h6 class="fw-600 mt-4 mb-3">Delivery Timeline</h6>
      ${renderActivityTimeline([
        {time:(dlv.createdAt || '09:00'),date:dlv.deliveryDate,action:'Delivery created',user:'Admin',type:'info'},
        ...(dlv.driverName?[{time:(dlv.assignedAt||'').split(' ')[1] || '09:30',date:(dlv.assignedAt||'').split(' ')[0] || dlv.deliveryDate,action:`Driver ${dlv.driverName} assigned`,user:'Admin',type:'info'}]:[]),
        ...(dlv.departedAt?[{time:dlv.departedAt.split(' ')[1],date:dlv.departedAt.split(' ')[0],action:'Delivery departed',user:dlv.driverName,type:'warning'}]:[]),
        ...(dlv.arrivedAt?[{time:dlv.arrivedAt.split(' ')[1],date:dlv.arrivedAt.split(' ')[0],action:'Delivery arrived at destination',user:dlv.driverName,type:'info'}]:[]),
        ...(dlv.completedAt?[{time:dlv.completedAt.split(' ')[1],date:dlv.completedAt.split(' ')[0],action:'Delivery completed - items handed over',user:dlv.driverName,type:'success'}]:[]),
        ...(dlv.failedAt?[{time:dlv.failedAt.split(' ')[1],date:dlv.failedAt.split(' ')[0],action:'Delivery failed',user:dlv.driverName,type:'danger'}]:[]),
        ...(dlv.rescheduledAt?[{time:dlv.rescheduledAt.split(' ')[1],date:dlv.rescheduledAt.split(' ')[0],action:'Delivery rescheduled',user:'Admin',type:'primary'}]:[]),
      ])}`;

    function departDelivery() {
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Departed');
      if (res.success) { showToast('Delivery departed', 'success'); setTimeout(() => location.reload(), 600); }
      else { showToast(res.error, 'error'); }
    }

    function arriveDelivery() {
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Arrived');
      if (res.success) { showToast('Arrived at site', 'success'); setTimeout(() => location.reload(), 600); }
      else { showToast(res.error, 'error'); }
    }

    function openPodModal() {
      new bootstrap.Modal(document.getElementById('podModal')).show();
    }

    function completeDelivery() {
      const name = document.getElementById('podName').value;
      const phone = document.getElementById('podPhone').value;
      if (!name) { showToast('Receiver name is required', 'warning'); return; }
      
      const podData = { receiverName: name, receiverPhone: phone, signatureMock: true };
      // BizLogic requires 'Arrived' -> 'Completed', PoD can be attached on 'Arrived' or passed in 'Completed'
      // Based on business logic, we just pass proofOfDelivery as extraData for Arrived, but here we can just update the object and transition to Completed
      
      // But wait, the engine says proofOfDelivery is saved when transitioning to Arrived, but we are already arrived. 
      // Let's modify the local object and let Completed save it.
      dlv.proofOfDelivery = podData; 
      
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Completed');
      if (res.success) { 
        // Force save the PoD that we injected
        MockData.save('deliveries'); 
        showToast('Delivery completed successfully!', 'success'); 
        setTimeout(() => location.reload(), 600); 
      }
      else { showToast(res.error, 'error'); }
    }

    function openFailModal() {
      new bootstrap.Modal(document.getElementById('failModal')).show();
    }

    function failDelivery() {
      const reason = document.getElementById('failReasonType').value;
      const notes = document.getElementById('failReasonText').value;
      
      const res = BizLogic.Delivery.updateStatus(dlv.id, 'Failed', { reason: reason, notes: notes });
      if (res.success) { 
        showToast('Delivery marked as failed', 'error'); 
        setTimeout(() => location.reload(), 600); 
      }
      else { showToast(res.error, 'error'); }
    }

    function rescheduleDelivery() {
      BizLogic.showConfirmModal('Jadwalkan Ulang', 'Pilih tanggal kirim baru untuk <strong>' + dlv.id + '</strong>. Setelah itu tugaskan driver lagi.',
        '<i class="bi bi-arrow-repeat me-1"></i>Jadwalkan Ulang', 'btn-primary',
        function(f) {
          const res = BizLogic.Delivery.updateStatus(dlv.id, 'Rescheduled', { newDate: f.newDate });
          if (!res.success) { showToast(res.error, 'error'); return; }
          showToast('Delivery rescheduled', 'success');
          setTimeout(() => location.reload(), 600);
        },
        [{ id: 'newDate', label: 'Tanggal Kirim Baru', type: 'date', required: true }]);
    }

    // Tugaskan driver & kendaraan (DLV Preparing / Rescheduled)
    function openAssign() {
      const drivers = MockData.drivers.filter(d => d.status === 'Available');
      if (!drivers.length) { showToast('Tidak ada driver yang tersedia', 'warning'); return; }
      const vehicles = MockData.vehicles.filter(v => v.status === 'Available');
      BizLogic.showConfirmModal('Tugaskan Driver', 'Pilih driver & kendaraan untuk <strong>' + dlv.id + '</strong>.',
        '<i class="bi bi-person-check me-1"></i>Tugaskan', 'btn-primary',
        function(f) {
          const res = BizLogic.Delivery.assign(dlv.id, { driverId: f.driverId, vehicleId: f.vehicleId, deliveryDate: f.deliveryDate });
          if (!res.success) { showToast(res.error, 'error'); return; }
          showToast('Driver ditugaskan', 'success');
          setTimeout(() => location.reload(), 600);
        },
        [{ id: 'driverId', label: 'Driver', type: 'select', options: drivers.map(d => ({ value: d.id, label: d.name })) },
         { id: 'vehicleId', label: 'Kendaraan', type: 'select', options: [{ value: '', label: '- Tanpa kendaraan -' }].concat(vehicles.map(v => ({ value: v.id, label: v.plate + ' - ' + v.brand }))) },
         { id: 'deliveryDate', label: 'Tanggal Kirim', type: 'date', value: dlv.deliveryDate }]);
    }

    // Cetak Surat Jalan Kirim
    function printSJ() {
      const c = MockData.company;
      const rows = dlv.items.map((i, n) => `<tr><td>${n + 1}</td><td>${i.name}</td><td>${i.qty}</td><td></td></tr>`).join('');
      const signs = ['Dibuat oleh', 'Gudang', 'Driver', 'Penerima'].map(t => `<div>${t}<div class="line"></div></div>`).join('');
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>${dlv.sjNo || dlv.id}</title>
        <style>body{font-family:Arial,sans-serif;font-size:13px;margin:32px;color:#111}h2{margin:0}table{width:100%;border-collapse:collapse;margin-top:16px}
        th,td{border:1px solid #999;padding:6px 8px;text-align:left}.meta td{border:none;padding:2px 0}
        .sign{display:flex;justify-content:space-between;margin-top:48px;text-align:center}.sign div{width:22%}.sign .line{margin-top:60px;border-top:1px solid #111}</style></head><body>
        <div style="display:flex;justify-content:space-between"><div><h2>${c.name}</h2><div>${c.address}</div><div>${c.phone}</div></div>
        <div style="text-align:right"><h2>SURAT JALAN PENGIRIMAN</h2><div>No. ${dlv.sjNo || '-'}</div><div>${dlv.id} / ${dlv.rentalId}</div></div></div>
        <table class="meta"><tr><td style="width:110px">Tanggal</td><td>: ${formatDate(dlv.deliveryDate)}</td><td style="width:110px">Driver</td><td>: ${dlv.driverName || '-'}</td></tr>
        <tr><td>Customer</td><td>: ${dlv.customerName}</td><td>Kendaraan</td><td>: ${dlv.vehiclePlate || '-'}</td></tr>
        <tr><td>Proyek</td><td>: ${dlv.projectName}</td><td>Tujuan</td><td>: ${dlv.destination || '-'}</td></tr></table>
        <table><thead><tr><th style="width:40px">No</th><th>Nama Alat</th><th style="width:80px">Qty</th><th>Keterangan</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="sign">${signs}</div></body></html>`;
      const w = window.open('', '_blank');
      w.document.write(html);
      w.document.close();
      setTimeout(() => w.print(), 400);
    }
  </script>
</body>
</html>
