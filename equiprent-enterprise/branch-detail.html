<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Cabang - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="er-card">
          <div class="detail-header" id="detailHeader"></div>
          <div class="er-tabs" id="detailTabs"></div>
          <div id="tabContents"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const bid = getUrlParam('id') || 'BR-001';
    const branch = MockData.branches.find(b => b.id === bid) || MockData.branches[0];
    initApp('branches.html',[{label:'Inventaris',href:'#'},{label:'Cabang',href:'branches.html'},{label:branch.name}],branch.name);

    const branchName = branch.name.replace(' Warehouse','');
    const branchStock = MockData.stock.filter(s => s.branch === branchName || s.branch === branch.name);
    const branchEquip = MockData.equipment.filter(e => e.branchId === branch.id);
    const SL = BizLogic.StockLedger;
    const whBal = SL.balances()['warehouse:' + branch.id] || {};
    const whQty = Object.values(whBal).reduce((a, v) => a + v, 0);
    const whAvail = branchStock.reduce((a, s) => a + s.available, 0);
    const whIssues = branchStock.reduce((a, s) => a + (s.damaged || 0), 0);
    const branchMov = MockData.stockMutations.filter(m => (m.from.type === 'warehouse' && m.from.id === branch.id) || (m.to.type === 'warehouse' && m.to.id === branch.id)).sort((a, b) => b.date.localeCompare(a.date));

    document.getElementById('detailHeader').innerHTML = `
      <div class="detail-header-left">
        <div class="detail-header-icon"><i class="bi bi-building"></i></div>
        <div class="detail-header-info">
          <h2>${branch.name} ${statusBadge(branch.status)}</h2>
          <div class="detail-meta">
            <span class="detail-meta-item"><i class="bi bi-hash"></i>${branch.code}</span>
            <span class="detail-meta-item"><i class="bi bi-geo-alt"></i>${branch.address}</span>
          </div>
        </div>
      </div>`;

    const tabs = ['Overview','Stock','Equipment','Movements','Rental Activity'];
    document.getElementById('detailTabs').innerHTML = tabs.map((t,i) =>
      `<button class="er-tab ${i===0?'active':''}" data-tab="${t.toLowerCase().replace(/\s/g,'-')}" onclick="switchTab('${t.toLowerCase().replace(/\s/g,'-')}')">${t}</button>`
    ).join('');

    let tc = '';
    tc += `<div class="er-tab-content active" id="tab-overview">
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi-card"><div class="kpi-icon blue"><i class="bi bi-boxes"></i></div><div class="kpi-content"><div class="kpi-value">${formatNumber(whQty)}</div><div class="kpi-label">Stok Fisik</div></div></div></div>
        <div class="col-md-3"><div class="kpi-card"><div class="kpi-icon green"><i class="bi bi-check-circle"></i></div><div class="kpi-content"><div class="kpi-value">${formatNumber(whAvail)}</div><div class="kpi-label">Tersedia</div></div></div></div>
        <div class="col-md-3"><div class="kpi-card"><div class="kpi-icon purple"><i class="bi bi-wrench"></i></div><div class="kpi-content"><div class="kpi-value">${formatNumber(whIssues)}</div><div class="kpi-label">Rusak</div></div></div></div>
        <div class="col-md-3"><div class="kpi-card"><div class="kpi-icon orange"><i class="bi bi-archive"></i></div><div class="kpi-content"><div class="kpi-value">${branch.capacity}</div><div class="kpi-label">Capacity</div></div></div></div>
      </div>
      <div class="info-grid">
        <div class="info-item"><span class="info-label">Branch Code</span><span class="info-value">${branch.code}</span></div>
        <div class="info-item"><span class="info-label">Address</span><span class="info-value">${branch.address}</span></div>
        <div class="info-item"><span class="info-label">Status</span><span class="info-value">${statusBadge(branch.status)}</span></div>
      </div>
    </div>`;

    tc += `<div class="er-tab-content" id="tab-stock">
      <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Nama Alat</th><th class="num">Stok Fisik</th><th class="num">Tersedia</th><th class="num">Dipesan</th><th class="num">Rusak</th></tr></thead><tbody>
      ${branchStock.filter(s => s.total || s.reserved).map(s=>`<tr><td>${s.equipment}</td><td class="num fw-600">${whBal[s.equipment] || 0}</td><td class="num"><span class="badge-status available">${s.available}</span></td><td class="num">${s.reserved}</td><td class="num">${s.damaged||0}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;

    tc += `<div class="er-tab-content" id="tab-equipment">
      <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>ID Aset</th><th>Name</th><th>Serial</th><th>Status</th><th>Proyek</th></tr></thead><tbody>
      ${branchEquip.map(e=>`<tr><td class="text-mono"><a href="equipment-detail.html?id=${e.id}" class="cell-link">${e.id}</a></td><td>${e.name}</td><td class="text-mono fs-12">${e.serial}</td><td>${statusBadge(e.status)}</td><td>${e.project||'-'}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;

    tc += `<div class="er-tab-content" id="tab-movements">
      <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>No. Dokumen</th><th>Tanggal</th><th>Jenis</th><th>Dari</th><th>Ke</th><th class="num">Efek</th></tr></thead><tbody>
      ${branchMov.map(m=>{ const q = m.items.reduce((a, i) => a + i.qty, 0); const inW = m.to.type === 'warehouse' && m.to.id === branch.id; return `<tr><td class="text-mono"><a href="stock-mutations.html?type=${m.type}" class="cell-link">${m.no}</a></td><td>${formatDate(m.date)}</td><td>${SL.TYPES[m.type].label}</td><td>${SL.locName(m.from)}</td><td>${SL.locName(m.to)}</td><td class="num ${inW ? 'qty-plus' : 'qty-minus'}">${inW ? '+' : '−'}${q}</td></tr>`; }).join('')}
      </tbody></table></div>
    </div>`;

    tc += `<div class="er-tab-content" id="tab-rental-activity">${renderActivityTimeline(MockData.activityLog.slice(0,5))}</div>`;

    document.getElementById('tabContents').innerHTML = tc;
  </script>
</body>
</html>
