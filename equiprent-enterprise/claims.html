<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaim - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-header-title">Klaim</h2>
            <p class="page-header-subtitle">Equipment loss and damage claims</p>
          </div>
        </div>
        <div class="er-card">
          <div class="er-card-body">
            <div class="table-toolbar">
              <div class="table-toolbar-left">
                <div class="table-search"><i class="bi bi-search"></i><input type="text" placeholder="Search claims..."
                    id="searchInput" oninput="filterData()"></div>
                <select class="filter-select" id="statusFilter" onchange="filterData()">
                  <option value="">Semua Status</option>
                  <option value="Draft">Draft</option>
                  <option value="Pending Customer Confirmation">Menunggu Konfirmasi Customer</option>
                  <option value="Approved">Disetujui</option>
                  <option value="Disputed">Disanggah</option>
                  <option value="Invoiced">Sudah Ditagih</option>
                  <option value="Paid">Lunas</option>
                  <option value="Closed">Ditutup</option>
                </select>
              </div>
            </div>
            <div class="er-table-wrapper">
              <table class="er-table">
                <thead>
                  <tr>
                    <th>No. Klaim</th>
                    <th>Pengembalian</th>
                    <th>Proyek</th>
                    <th>Pelanggan</th>
                    <th>Equipment</th>
                    <th>Qty</th>
                    <th>Jumlah</th>
                    <th>Status</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('claims.html', [{ label: 'Penyewaan', href: '#' }, { label: 'Klaim' }], 'Klaim');
    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const s = document.getElementById('statusFilter').value;
      const data = MockData.claims.filter(c => {
        if (q && !c.id.toLowerCase().includes(q) && !c.customerName.toLowerCase().includes(q) && !c.equipment.toLowerCase().includes(q)) return false;
        const st = c.status === 'Waiting Customer Confirmation' ? 'Pending Customer Confirmation' : c.status;
        if (s && st !== s) return false; return true;
      });
      document.getElementById('tableBody').innerHTML = data.map(c => `<tr>
        <td><a href="claim-detail.html?id=${c.id}" class="cell-link text-mono">${c.id}</a></td>
        <td><a href="return-detail.html?id=${c.returnId}" class="cell-link">${c.returnId}</a></td>
        <td>${c.projectName || '-'}</td><td>${c.customerName}</td><td>${c.equipment}</td><td>${c.quantity}</td>
        <td class="fw-600">${formatRupiah(c.claimAmount)}</td><td>${statusBadge(c.status)}</td>
        <td><a href="claim-detail.html?id=${c.id}" class="btn-action"><i class="bi bi-eye"></i></a></td>
      </tr>`).join('') || '<tr><td colspan="9" class="text-center text-muted py-4">Tidak ada klaim ditemukan</td></tr>';
    }
    filterData();
  </script>
</body>

</html>
