<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengemudi — EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Pengemudi</h2><p class="page-header-subtitle">Manage driver personnel</p></div>
          <div class="page-header-actions"><button class="btn btn-primary btn-sm" onclick="showToast('Add driver form','info')"><i class="bi bi-plus-lg me-1"></i>Tambah Pengemudi</button></div>
        </div>
        <div class="er-card"><div class="er-card-body">
          <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>ID Pengemudi</th><th>Name</th><th>Telepon</th><th>License #</th><th>Berlaku Sampai</th><th>Status</th><th>Pengiriman Aktif</th><th>Aksi</th></tr></thead>
          <tbody id="tableBody"></tbody></table></div>
        </div></div>
      </div>
    </main>
  </div>

  <!-- Add Driver Modal -->
  <div class="modal fade" id="addDriverModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="driverForm" class="needs-validation" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Tambah Pengemudi Baru</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label form-label-er">Driver Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="drvName" required placeholder="e.g. Budi Santoso">
                <div class="invalid-feedback">Driver name is required.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Status</label>
                <select class="form-select" id="drvStatus">
                  <option value="Available">Tersedia</option>
                  <option value="Off Duty">Off Duty</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Nomor Telepon <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="drvPhone" required>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">License Number (SIM) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="drvLicense" required>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">License Expiry Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="drvExpiry" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan Pengemudi</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('drivers.html',[{label:'Data Master',href:'#'},{label:'Pengemudi'}],'Pengemudi');

    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-toggle', 'modal');
    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-target', '#addDriverModal');
    document.querySelector('.page-header-actions .btn-primary').removeAttribute('onclick');

    document.getElementById('driverForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        e.stopPropagation();
        this.classList.add('was-validated');
        return;
      }

      const newDrv = {
        id: MockData.generateId('DRV', 'drivers'),
        name: document.getElementById('drvName').value,
        phone: document.getElementById('drvPhone').value,
        licenseNumber: document.getElementById('drvLicense').value,
        licenseExpiry: document.getElementById('drvExpiry').value,
        status: document.getElementById('drvStatus').value,
        currentDelivery: null
      };

      MockData.drivers.push(newDrv);
      MockData.save('drivers');

      bootstrap.Modal.getInstance(document.getElementById('addDriverModal')).hide();
      showToast('Driver berhasil ditambahkan.', 'success');
      
      this.reset();
      this.classList.remove('was-validated');
      
      renderTable();
    });

    function renderTable() {
      document.getElementById('tableBody').innerHTML=MockData.drivers.map(d=>`<tr>
        <td class="text-mono">${d.id}</td>
        <td><a href="driver-detail.html?id=${d.id}" class="cell-link">${d.name}</a></td>
        <td>${d.phone}</td><td>${d.licenseNumber}</td><td>${formatDate(d.licenseExpiry)}</td>
        <td>${statusBadge(d.status)}</td>
        <td>${d.currentDelivery?`<a href="delivery-detail.html?id=${d.currentDelivery}" class="cell-link">${d.currentDelivery}</a>`:'-'}</td>
        <td><a href="driver-detail.html?id=${d.id}" class="btn-action"><i class="bi bi-eye"></i></a><button class="btn-action"><i class="bi bi-pencil"></i></button></td>
      </tr>`).join('');
    }
    renderTable();
  </script>
</body>
</html>
