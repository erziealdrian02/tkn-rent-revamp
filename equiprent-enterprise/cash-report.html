<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Kas - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    .cash-report td, .cash-report th { vertical-align: middle; }
    .cash-report .sec-row td { background: var(--bg-table-stripe); font-weight: 700; }
    .cash-report .grp-row td { font-weight: 600; }
    .cash-report .cat-row td:nth-child(2) { padding-left: 32px; }
    .cash-report .total-row td { font-weight: 600; border-top: 1px solid var(--border-color); }
    .cash-report .saldo-row td { font-weight: 700; }
    .cash-report .is-zero { color: var(--text-muted); }
    @media print { .cash-report a { color: inherit; text-decoration: none; } }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header">
          <div class="page-header-left"><h2 class="page-header-title">Laporan Kas</h2><p class="page-header-subtitle">Arus kas tunai & bank per periode. Setelah dicek, Accounting <strong>generate</strong> ke jurnal → masuk COA.</p></div>
          <div class="page-header-actions no-print">
            <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()"><i class="bi bi-download me-1"></i>Export CSV</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i>Cetak</button>
            <a href="journal.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-journal-bookmark me-1"></i>Jurnal (COA)</a>
            <a href="finance-ledger.html" class="btn btn-primary btn-sm"><i class="bi bi-wallet2 me-1"></i>Buku Kas & Bank</a>
          </div>
        </div>

        <div class="er-card mb-4 no-print"><div class="er-card-body">
          <div class="table-toolbar mb-0"><div class="table-toolbar-left flex-wrap">
            <label class="fs-13 text-muted">Periode</label>
            <input type="date" class="filter-select" id="fFrom" onchange="render()">
            <span class="text-muted">s/d</span>
            <input type="date" class="filter-select" id="fTo" onchange="render()">
            <select class="filter-select" id="fAccount" onchange="render()"></select>
            <label class="d-flex align-items-center gap-2 fs-13"><input type="checkbox" class="form-check-input m-0" id="fZero" checked onchange="render()"> Tampilkan kategori bernilai 0</label>
          </div></div>
        </div></div>

        <div id="genPanel" class="no-print"></div>
        <div class="row g-3 mb-4" id="kpis"></div>

        <div class="er-card"><div class="er-card-body">
          <div class="text-center mb-3">
            <h5 class="fw-700 mb-0" id="companyName"></h5>
            <div class="fw-600">LAPORAN KAS</div>
            <div class="fs-13 text-muted" id="periodText"></div>
          </div>
          <div class="er-table-wrapper"><table class="er-table cash-report">
            <thead><tr><th style="width:48px">No</th><th>Keterangan</th><th class="num" style="width:170px">Debit (Masuk)</th><th class="num" style="width:170px">Kredit (Keluar)</th><th class="num" style="width:170px">Saldo</th></tr></thead>
            <tbody id="reportBody"></tbody>
          </table></div>
          <p class="fs-12 text-muted mt-2 mb-0"><i class="bi bi-info-circle me-1"></i>Klik nama kategori untuk melihat rincian transaksinya di Buku Kas & Bank.</p>
        </div></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/business-logic.js"></script>
  <script src="assets/js/accounting.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('cash-report.html', [{label:'Keuangan',href:'#'},{label:'Laporan Kas'}], 'Laporan Kas');
    const CB = BizLogic.CashBank;
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('companyName').textContent = MockData.company.name;
    document.getElementById('fFrom').value = today.substr(0, 8) + '01';
    document.getElementById('fTo').value = today;
    document.getElementById('fAccount').innerHTML = '<option value="">Semua Akun Kas & Bank</option>' +
      ['Kas', 'Bank'].map(k => `<optgroup label="${k}">${MockData.accounts.filter(a => CB.kindOf(a) === k).map(a => `<option value="${a.id}">${a.name}</option>`).join('')}</optgroup>`).join('');

    let current = null;
    const money = v => v ? formatRupiah(v) : '<span class="is-zero">-</span>';
    // Kelompok COA default tiap kategori (diatur di Bagan Akun → Pemetaan Laporan Kas)
    function coaTag(cat) {
      if (CB.CATEGORIES[cat] && CB.CATEGORIES[cat].transferOnly) return '';
      const a = BizLogic.Accounting.account(BizLogic.Accounting.mapOf(cat));
      const jcs = CB.jcats().filter(c => c.cash && Object.values(c.cash).includes(cat));
      if (jcs.length) return `<span class="d-block fs-11 text-muted no-print" title="Kategori jurnal yang masuk baris ini"><i class="bi bi-tags me-1"></i>${jcs.map(c => c.name).join(', ')}</span>`;
      return a ? `<a href="coa.html?tab=map" class="d-block fs-11 text-muted no-print" title="Akun COA (pemetaan)"><i class="bi bi-diagram-3 me-1"></i>${a.code} · ${a.name}</a>` : '';
    }

    function ledgerLink(kind, cat, label) {
      const p = new URLSearchParams({ kind, category: cat, from: document.getElementById('fFrom').value, to: document.getElementById('fTo').value });
      if (document.getElementById('fAccount').value) p.set('account', document.getElementById('fAccount').value);
      return `<a href="finance-ledger.html?${p}" class="text-reset">${label}</a>`;
    }

    function sectionRows(no, sec, title, inTitle, outTitle) {
      const showZero = document.getElementById('fZero').checked;
      const kindLow = sec.kind === 'Kas' ? 'Kas' : 'Bank';
      const cats = type => CB.categoriesFor(sec.kind, type, true);
      const catRows = (type) => cats(type).filter(k => showZero || sec.rows[k].amount).map(k => `<tr class="cat-row">
          <td class="text-center text-muted">-</td>
          <td>${ledgerLink(sec.kind, k, CB.categoryLabel(k))}${sec.rows[k].count ? ` <span class="fs-11 text-muted">(${sec.rows[k].count})</span>` : ''}${coaTag(k)}</td>
          <td class="num">${type === 'IN' ? money(sec.rows[k].amount) : ''}</td>
          <td class="num">${type === 'OUT' ? money(sec.rows[k].amount) : ''}</td><td></td></tr>`).join('');
      const accRows = sec.accounts.length > 1 ? `<tr><td></td><td colspan="4" class="p-0"><table class="w-100 fs-12 text-muted my-1">
          <tr><th class="fw-600 py-1">Rincian per akun</th><th class="text-end py-1">Saldo Awal</th><th class="text-end py-1">Masuk</th><th class="text-end py-1">Keluar</th><th class="text-end py-1">Saldo Akhir</th></tr>
          ${sec.accounts.map(a => { const r = CB.report(current.from, current.to, a.id)[sec.kind];
            return `<tr><td class="py-1">${a.name}</td><td class="text-end py-1">${formatRupiah(r.opening)}</td><td class="text-end py-1">${formatRupiah(r.totalIn)}</td><td class="text-end py-1">${formatRupiah(r.totalOut)}</td><td class="text-end py-1">${formatRupiah(r.closing)}</td></tr>`; }).join('')}
        </table></td></tr>` : '';
      return `
        <tr class="sec-row"><td class="text-center">${no}</td><td colspan="4">${title}</td></tr>
        ${sec.accounts.length ? `
        <tr class="saldo-row"><td></td><td>Saldo Awal ${kindLow} Perusahaan</td><td></td><td></td><td class="num">${formatRupiah(sec.opening)}</td></tr>
        <tr class="grp-row"><td class="text-center">A</td><td class="text-primary">${inTitle}</td><td colspan="3"></td></tr>
        ${catRows('IN')}
        <tr class="total-row"><td></td><td>Total ${kindLow} Masuk</td><td class="num">${formatRupiah(sec.totalIn)}</td><td></td><td class="num">${formatRupiah(sec.opening + sec.totalIn)}</td></tr>
        <tr class="grp-row"><td class="text-center">B</td><td class="text-danger">${outTitle}</td><td colspan="3"></td></tr>
        ${catRows('OUT')}
        <tr class="total-row"><td></td><td>Total ${kindLow} Keluar</td><td></td><td class="num">${formatRupiah(sec.totalOut)}</td><td class="num">${formatRupiah(sec.closing)}</td></tr>
        <tr class="saldo-row"><td></td><td>Saldo Akhir ${kindLow} Perusahaan</td><td></td><td></td><td class="num">${formatRupiah(sec.closing)}</td></tr>
        ${accRows}` : `<tr><td></td><td colspan="4" class="text-muted">Tidak ada akun ${kindLow} pada filter ini</td></tr>`}`;
    }

    function reconRows(bankSec) {
      const recs = MockData.reconciliations || [];
      return `
        <tr class="sec-row"><td class="text-center">III</td><td colspan="4">REKONSILIASI BANK</td></tr>
        <tr><td></td><td colspan="4" class="fs-13 text-muted">Mencocokkan transaksi yang ada di sistem perusahaan dengan mutasi rekening bank.</td></tr>
        ${bankSec.accounts.map(a => {
          const list = MockData.ledger.filter(e => e.bankAccountId === a.id && e.date >= current.from && e.date <= current.to);
          const ok = list.filter(e => e.reconciled).length;
          const last = recs.filter(r => r.accountId === a.id).slice(-1)[0];
          const p = new URLSearchParams({ account: a.id, from: current.from, to: current.to });
          return `<tr class="cat-row"><td class="text-center text-muted">-</td>
            <td>${a.name} <span class="fs-12 text-muted">· ${list.length} transaksi, ${ok} cocok${list.length - ok ? `, <span class="text-danger">${list.length - ok} belum</span>` : ''}</span>
              <div class="fs-12 text-muted">${last ? `Terakhir: ${formatDate(last.start)} - ${formatDate(last.end)} · ${last.status === 'Cocok' ? '<span class="text-success">Cocok</span>' : `<span class="text-danger">Selisih ${formatRupiah(last.difference)}</span>`}` : 'Belum pernah direkonsiliasi'}</div></td>
            <td colspan="3" class="text-end no-print"><a href="bank-reconciliation.html?${p}" class="btn btn-outline-primary btn-sm"><i class="bi bi-check2-square me-1"></i>Rekonsiliasi</a></td></tr>`;
        }).join('') || '<tr><td></td><td colspan="4" class="text-muted">Tidak ada rekening bank pada filter ini</td></tr>'}`;
    }

    // ---------- Generate ke Jurnal (Accounting) ----------
    function renderGen() {
      const to = document.getElementById('fTo').value, pend = CB.pending(null, to), all = CB.pending();
      const canGen = canDo('Accounting', 'Create');
      const batches = {};
      (MockData.ledger || []).forEach(e => { if (e.batch) { const b = batches[e.batch] = batches[e.batch] || { n: 0, total: 0, at: e.postedAt, by: e.postedBy }; b.n++; b.total += e.amount; } });
      const last = Object.keys(batches).sort().reverse().slice(0, 3);
      const catName = e => e.jcat && CB.jcat(e.jcat) ? CB.jcatName(e.jcat) : CB.categoryLabel(CB.categoryOf(e));
      document.getElementById('genPanel').innerHTML = `<div class="er-card mb-4" style="border-left:4px solid var(${pend.length ? '--warning' : '--success'})"><div class="er-card-body">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <h6 class="fw-600 mb-0"><i class="bi bi-journal-arrow-down me-1"></i>Generate Laporan Kas ke Jurnal</h6>
          <span class="fs-12 text-muted">Transaksi kasir → <strong>Generate</strong> → Jurnal → Buku Besar → COA. Input Finance / Accounting sudah langsung masuk jurnal.</span>
          ${pend.length && canGen ? `<button class="btn btn-warning btn-sm ms-auto" onclick="generate()"><i class="bi bi-lightning-charge me-1"></i>Generate ${pend.length} transaksi s/d ${formatDate(to)}</button>` : ''}
          ${pend.length && !canGen ? '<span class="badge bg-warning-subtle text-warning ms-auto">Menunggu Accounting generate</span>' : ''}
          ${!pend.length ? `<span class="badge bg-success-subtle text-success ms-auto"><i class="bi bi-check2 me-1"></i>Semua transaksi s/d ${formatDate(to)} sudah masuk jurnal</span>` : ''}
        </div>
        ${pend.length ? `<div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Tanggal</th><th>Kode Transaksi</th><th>Rekening</th><th>Kategori</th><th>Notes</th><th>Input oleh</th><th class="num">Debet</th><th class="num">Kredit</th></tr></thead><tbody>
          ${pend.map(e => `<tr><td>${formatDate(e.date)}</td><td class="text-mono fs-12">${e.voucherNo}</td><td>${CB.account(e.bankAccountId).name}</td><td class="fs-12">${catName(e)}</td><td class="fs-12">${e.description}</td><td class="fs-12">${e.user}</td>
            <td class="num">${e.type === 'IN' ? formatRupiah(e.amount) : ''}</td><td class="num">${e.type === 'OUT' ? formatRupiah(e.amount) : ''}</td></tr>`).join('')}
          </tbody></table></div>${all.length > pend.length ? `<p class="fs-12 text-muted mb-0 mt-1">${all.length - pend.length} transaksi lain setelah ${formatDate(to)} belum ikut.</p>` : ''}` : ''}
        ${last.length ? `<div class="fs-12 text-muted mt-2">Generate terakhir: ${last.map(b => `<span class="me-3"><span class="text-mono">${b}</span> · ${batches[b].n} transaksi · ${formatRupiah(batches[b].total)} · ${batches[b].by || ''}</span>`).join('')}</div>` : ''}
      </div></div>`;
    }
    function generate() {
      const r = CB.generate(null, document.getElementById('fTo').value);
      if (!r.success) { showToast(r.error, 'error'); return; }
      showToast(`${r.count} transaksi (${formatRupiah(r.total)}) masuk jurnal · ${r.batch}`, 'success');
      render();
    }

    function render() {
      const from = document.getElementById('fFrom').value, to = document.getElementById('fTo').value;
      if (!from || !to || to < from) { showToast('Periode tidak valid', 'error'); return; }
      const acc = document.getElementById('fAccount').value;
      const rep = CB.report(from, to, acc);
      current = { from, to, rep };
      renderGen();
      document.getElementById('periodText').textContent = `Periode ${formatDate(from)} s/d ${formatDate(to)}${acc ? ' · ' + CB.account(acc).name : ''}`;
      const K = rep.Kas, B = rep.Bank;
      const opening = K.opening + B.opening, tin = K.totalIn + B.totalIn, tout = K.totalOut + B.totalOut;
      document.getElementById('kpis').innerHTML = [
        ['blue', 'bi-hourglass-top', 'Saldo Awal Kas & Bank', opening],
        ['green', 'bi-plus-circle', 'Total Masuk (Bon Biru)', tin],
        ['red', 'bi-dash-circle', 'Total Keluar (Bon Merah)', tout],
        ['purple', 'bi-wallet2', 'Saldo Akhir Kas & Bank', opening + tin - tout]
      ].map(([c, i, l, v]) => `<div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-icon ${c}"><i class="bi ${i}"></i></div><div class="kpi-content"><div class="kpi-value fs-5">${formatRupiah(v)}</div><div class="kpi-label">${l}</div></div></div></div>`).join('');

      document.getElementById('reportBody').innerHTML =
        sectionRows('I', K, 'CASH ACCOUNT (KAS TUNAI)', 'Kas Masuk (Bon Biru) = Menambah Saldo Kas', 'Kas Keluar (Bon Merah) = Mengurangi Saldo Kas') +
        sectionRows('II', B, 'BANK ACCOUNT', 'Bank Masuk (Bon Biru) = Menambah Saldo Bank', 'Bank Keluar (Bon Merah) = Mengurangi Saldo Bank') +
        reconRows(B) +
        `<tr class="sec-row"><td></td><td>TOTAL SALDO AKHIR KAS + BANK</td><td class="num">${formatRupiah(tin)}</td><td class="num">${formatRupiah(tout)}</td><td class="num">${formatRupiah(opening + tin - tout)}</td></tr>`;
    }

    function exportCSV() {
      const { from, to, rep } = current;
      const out = [['Laporan Kas', MockData.company.name], ['Periode', from + ' s/d ' + to], [], ['Bagian', 'Kelompok', 'Keterangan', 'Debit (Masuk)', 'Kredit (Keluar)', 'Saldo']];
      [['I. CASH ACCOUNT', rep.Kas], ['II. BANK ACCOUNT', rep.Bank]].forEach(([title, sec]) => {
        out.push([title, '', 'Saldo Awal', '', '', sec.opening]);
        CB.categoriesFor(sec.kind, 'IN', true).forEach(k => out.push([title, 'A. Masuk (Bon Biru)', CB.categoryLabel(k), sec.rows[k].amount, '', '']));
        out.push([title, '', 'Total Masuk', sec.totalIn, '', '']);
        CB.categoriesFor(sec.kind, 'OUT', true).forEach(k => out.push([title, 'B. Keluar (Bon Merah)', CB.categoryLabel(k), '', sec.rows[k].amount, '']));
        out.push([title, '', 'Total Keluar', '', sec.totalOut, '']);
        out.push([title, '', 'Saldo Akhir', '', '', sec.closing]);
      });
      downloadCSV(`laporan-kas-${from}-${to}.csv`, out);
    }

    render();
  </script>
</body>
</html>
