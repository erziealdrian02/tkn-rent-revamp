<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles & Permissions - EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header"><div class="page-header-left"><h2 class="page-header-title">Roles & Permissions</h2><p class="page-header-subtitle">Manage access levels</p></div>
        <div class="page-header-actions"><a href="role-create.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Tambah Peran</a></div></div>
        <div class="er-card"><div class="er-card-body">
          <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>Role Name</th><th>Deskripsi</th><th>Users</th><th>Akses Modul</th><th>Aksi</th></tr></thead>
          <tbody id="tableBody"></tbody></table></div>
        </div></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('roles.html',[{label:'Settings',href:'#'},{label:'Peran'}],'Roles & Permissions');
    // Daftar peran + ringkasan akses dari MockData.permissions.matrix (dipakai untuk akses menu & halaman)
    const modules = MockData.permissions.modules;
    document.getElementById('tableBody').innerHTML = MockData.roles.map(r => {
      const users = MockData.demoUsers.filter(u => u.role === r.name).length;
      const access = modules.filter(m => roleActions(r.name, m).length);
      const canApprove = modules.some(m => roleActions(r.name, m).indexOf('Approve') >= 0);
      return `<tr>
        <td class="fw-600">${r.name}${canApprove ? ' <span class="badge bg-success-subtle text-success fs-11">bisa menyetujui</span>' : ''}</td>
        <td>${r.description || '-'}</td><td>${users}</td>
        <td class="fs-12">${access.length === modules.length ? 'Semua modul' : access.join(', ') || '<span class="text-muted">Tidak ada</span>'}</td>
        <td>${r.name === 'Admin' ? '' : `<a class="btn-action" title="Ubah hak akses" href="role-create.html?role=${encodeURIComponent(r.name)}"><i class="bi bi-shield-lock"></i></a>`}</td>
      </tr>`;
    }).join('');
  </script>
</body>
</html>
