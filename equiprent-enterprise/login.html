<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EquipRent Enterprise</title>
  <meta name="description" content="EquipRent Enterprise Equipment Rental & Asset Management System">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    .login-split {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .login-image {
      flex: 0 0 75%;
      background: url('assets/images/background-login.jpg') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    .login-image-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.2), rgba(15, 23, 42, 0.9));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 60px;
      color: white;
    }

    .login-form-container {
      flex: 0 0 25%;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.1);
      z-index: 10;
      overflow-y: auto;
    }

    .login-brand-split {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      text-align: center;
    }

    .login-brand-icon-split {
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .login-brand-split h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
      letter-spacing: -0.5px;
    }

    .login-brand-split p {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    .login-footer-split {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .login-image {
        flex: 0 0 65%;
      }

      .login-form-container {
        flex: 0 0 35%;
        padding: 30px;
      }
    }

    @media (max-width: 992px) {
      .login-image {
        flex: 0 0 50%;
      }

      .login-form-container {
        flex: 0 0 50%;
      }

      .login-image-overlay {
        padding: 40px;
      }
    }

    @media (max-width: 768px) {
      .login-image {
        display: none;
      }

      .login-form-container {
        flex: 1;
        padding: 24px;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="login-split">
    <!-- Left Side: Image (75%) -->
    <div class="login-image">
      <div class="login-image-overlay">
        <h2 class="display-5 fw-bold text-white mb-2">EquipRent Enterprise</h2>
        <p class="fs-5 text-white-50 mb-0">Next-generation equipment rental and logistics management system.</p>
      </div>
    </div>

    <!-- Right Side: Form (25%) -->
    <div class="login-form-container">
      <div class="login-brand-split">
        <div class="login-brand-icon-split"><i class="bi bi-gear-wide-connected"></i></div>
        <h1>Welcome Back</h1>
        <p>Please sign in to your account</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label form-label-er" for="username">Username / Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" value="admin" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label form-label-er" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" value="demo"
              required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
              <i class="bi bi-eye" id="pwdIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label form-label-er">Demo Login As</label>
          <select class="form-select" id="roleSelect" onchange="setDemoUser()">
            <option value="superadmin">Super Admin</option>
            <option value="admin" selected>Admin</option>
            <option value="rental">Rental Staff</option>
            <option value="warehouse">Warehouse Staff</option>
            <option value="finance">Finance</option>
            <option value="manager">Manager</option>
            <option value="driver">Driver</option>
          </select>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label fs-13" for="remember">Remember me</label>
          </div>
          <a href="#" class="fs-12 text-primary text-decoration-none">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn" style="padding: 10px 0;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div id="loginError" class="alert alert-danger mt-3 py-2 fs-12 d-none">
          <i class="bi bi-exclamation-circle me-1"></i> Invalid credentials
        </div>
      </form>

      <div class="login-footer-split">
        <p class="mb-1">&copy; 2026 PT EquipRent Indonesia.<br>All rights reserved.</p>
      </div>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script>
    // Init theme on login page too
    const saved = localStorage.getItem('er_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);

    // Auto-redirect if already logged in
    const existingUser = sessionStorage.getItem('er_user');
    if (existingUser) {
      const u = JSON.parse(existingUser);
      window.location.href = u.role === 'Driver' ? 'driver-dashboard.html' : 'dashboard.html';
    }

    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('pwdIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function setDemoUser() {
      const role = document.getElementById('roleSelect').value;
      document.getElementById('username').value = role;
      document.getElementById('password').value = 'demo';
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const user = MockData.demoUsers.find(u => u.username === username && u.password === password);
      if (!user) {
        document.getElementById('loginError').classList.remove('d-none');
        return;
      }

      document.getElementById('loginError').classList.add('d-none');
      sessionStorage.setItem('er_user', JSON.stringify(user));

      // Animate button
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing in...';
      btn.disabled = true;

      setTimeout(() => {
        window.location.href = user.role === 'Driver' ? 'driver-dashboard.html' : 'dashboard.html';
      }, 600);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
