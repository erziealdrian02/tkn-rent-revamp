<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles — EquipRent Enterprise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="app-main">
      <header class="app-header" id="appHeader"></header>
      <div class="app-content">
        <div class="page-header"><div class="page-header-left"><h2 class="page-header-title">Vehicles</h2><p class="page-header-subtitle">Delivery vehicle fleet management</p></div>
        <div class="page-header-actions"><button class="btn btn-primary btn-sm" onclick="showToast('Add vehicle','info')"><i class="bi bi-plus-lg me-1"></i>Add Vehicle</button></div></div>
        <div class="er-card"><div class="er-card-body">
          <div class="table-toolbar"><div class="table-toolbar-left">
            <select class="filter-select" id="statusFilter" onchange="filterData()"><option value="">All Status</option><option>Available</option><option>On Delivery</option><option>Maintenance</option></select>
          </div></div>
          <div class="er-table-wrapper"><table class="er-table"><thead><tr><th>ID</th><th>License Plate</th><th>Type</th><th>Brand</th><th>Capacity (Ton)</th><th>Tax Expiry</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tableBody"></tbody></table></div>
        </div></div>
      </div>
    </main>
  </div>

  <!-- Add Vehicle Modal -->
  <div class="modal fade" id="addVehicleModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="vehicleForm" class="needs-validation" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Add New Vehicle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label form-label-er">License Plate <span class="text-danger">*</span></label>
                <input type="text" class="form-control text-uppercase" id="vhcPlate" required placeholder="e.g. B 1234 XYZ">
                <div class="invalid-feedback">License plate is required.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Status</label>
                <select class="form-select" id="vhcStatus">
                  <option value="Available">Available</option>
                  <option value="Maintenance">Maintenance</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Vehicle Type <span class="text-danger">*</span></label>
                <select class="form-select" id="vhcType" required>
                  <option value="Truck">Truck</option>
                  <option value="Pickup">Pickup</option>
                  <option value="Van">Van</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label form-label-er">Capacity (Ton) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="vhcCapacity" required placeholder="e.g. 5 Ton">
              </div>
              <div class="col-12">
                <label class="form-label form-label-er">Brand & Model <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="vhcBrand" required placeholder="e.g. Mitsubishi Colt Diesel">
              </div>
              <div class="col-12">
                <label class="form-label form-label-er">Tax Expiry Date</label>
                <input type="date" class="form-control" id="vhcTax">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Vehicle</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initApp('vehicles.html',[{label:'Master Data',href:'#'},{label:'Vehicles'}],'Vehicles');

    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-toggle', 'modal');
    document.querySelector('.page-header-actions .btn-primary').setAttribute('data-bs-target', '#addVehicleModal');
    document.querySelector('.page-header-actions .btn-primary').removeAttribute('onclick');

    document.getElementById('vehicleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        e.stopPropagation();
        this.classList.add('was-validated');
        return;
      }

      const newVhc = {
        id: MockData.generateId('VHC', 'vehicles'),
        plate: document.getElementById('vhcPlate').value.toUpperCase(),
        type: document.getElementById('vhcType').value,
        brand: document.getElementById('vhcBrand').value,
        capacity: document.getElementById('vhcCapacity').value,
        status: document.getElementById('vhcStatus').value,
        taxExpiry: document.getElementById('vhcTax').value || '2028-01-01',
        driverId: null,
        driverName: null,
        currentDelivery: null
      };

      MockData.vehicles.push(newVhc);
      MockData.save('vehicles');

      bootstrap.Modal.getInstance(document.getElementById('addVehicleModal')).hide();
      showToast('Vehicle successfully added.', 'success');
      
      this.reset();
      this.classList.remove('was-validated');
      
      filterData();
    });

    function filterData(){
      const s=document.getElementById('statusFilter').value;
      const data=MockData.vehicles.filter(v=>{if(s&&v.status!==s)return false;return true;});
      document.getElementById('tableBody').innerHTML=data.map(v=>`<tr>
        <td class="text-mono">${v.id}</td><td><a href="vehicle-detail.html?id=${v.id}" class="cell-link fw-600">${v.plate}</a></td>
        <td>${v.type}</td><td>${v.brand}</td><td>${v.capacity}</td><td>${v.taxExpiry ? formatDate(v.taxExpiry) : '-'}</td>
        <td>${statusBadge(v.status)}</td>
        <td><a href="vehicle-detail.html?id=${v.id}" class="btn-action"><i class="bi bi-eye"></i></a><button class="btn-action"><i class="bi bi-pencil"></i></button></td>
      </tr>`).join('')||'<tr><td colspan="8" class="text-center text-muted py-4">No vehicles found</td></tr>';
    }
    filterData();
  </script>
</body>
</html>
